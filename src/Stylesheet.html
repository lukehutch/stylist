<style>
  :root {
    /* One knob for the whole sidebar. Everything below is derived from --fs,
       so bump this one number to scale the UI. */
    --fs: 14.5px;
    --fs-md: calc(var(--fs) - 1px);
    --fs-sm: calc(var(--fs) - 1.5px);
    --fs-xs: calc(var(--fs) - 2px);

    --fg: #202124;
    --muted: #5f6368;
    --line: #dadce0;
    --band: #f1f3f4;
    --bg: #fff;
    --accent: #1a73e8;
    --warn-bg: #fef7e0;
    --warn-line: #f9ab00;
    --err: #d93025;
    --ok: #188038;
  }
  * { box-sizing: border-box; }
  body {
    font: var(--fs)/1.45 Roboto, Arial, sans-serif;
    color: var(--fg); margin: 0; background: var(--bg);
  }
  .wrap { padding: 8px 10px 40px; }

  /* Section headings sit in a full-bleed band: the .wrap padding is 8px 10px,
     so the negative margins cancel it and the background reaches both edges. */
  h2 { font-size: calc(var(--fs) * 1.25); font-weight: 500;
       margin: 14px -10px 8px; padding: 6px 10px;
       background: var(--band); border-top: 1px solid var(--line);
       border-bottom: 1px solid var(--line); }
  h3 { font-size: var(--fs-md); margin: 10px 0 4px; font-weight: 500; color: var(--muted); }
  p.hint { color: var(--muted); font-size: var(--fs-sm); margin: 4px 0 8px; }

  /* ---- top bar ---- */
  .topbar { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .topbar .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                   font-size: calc(var(--fs) * 2); line-height: 1.25; margin-bottom: 4px; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .row > label { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
  .row > select, .row > input { flex: 1; min-width: 0; }

  /* ---- tab strip ---- */
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
  .tabs button {
    flex: 1 1 auto; padding: 5px 6px; font-size: var(--fs-sm); cursor: pointer;
    border: 1px solid var(--line); background: #f8f9fa; border-radius: 4px; color: var(--muted);
  }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- fields ---- */
  .field { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .field > label { flex: 0 0 118px; color: var(--muted); font-size: var(--fs-sm); }
  .field > .ctl { flex: 1; display: flex; gap: 4px; min-width: 0; }
  input[type=text], input[type=number], select {
    width: 100%; min-width: 0; padding: 3px 5px; font: inherit; font-size: var(--fs-md);
    border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--fg);
  }
  input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
  input.invalid { border-color: var(--err); background: #fce8e6; }
  input.saving { border-color: var(--accent); }
  .unit { flex: 0 0 26px; color: var(--muted); font-size: var(--fs-xs); align-self: center; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin: 5px 0; }
  .checks label { font-size: var(--fs-sm); display: flex; align-items: center; gap: 3px; color: var(--fg); }

  /* ---- lists / disclosure ---- */
  /* Expander. The open/closed height is a grid track going 0fr -> 1fr, which
     animates to whatever the content actually measures without JS having to
     measure it. Padding and the divider transition with it, otherwise a
     collapsed row would still be ~17px tall. Browsers that will not
     interpolate fr units simply snap, as this did before. */
  .item { border: 1px solid var(--line); border-radius: 4px; margin: 5px 0; overflow: hidden;
          display: grid; grid-template-rows: auto 0fr;
          transition: grid-template-rows 160ms ease; }
  .item.open { grid-template-rows: auto 1fr; }
  .item > .head {
    padding: 6px 8px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 6px; background: #f8f9fa;
  }
  .item > .head:hover { background: #f1f3f4; }
  .item > .head .name { font-weight: 500; font-size: var(--fs-md); margin-right: auto; }
  /* Turnstile: a CSS triangle pointing right, rotated a quarter turn to point
     down when the row is open, on the same 160ms as the row itself. */
  .item > .head .tw {
    flex: 0 0 auto; width: 0; height: 0;
    border-left: 6px solid var(--muted);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    transition: transform 160ms ease;
  }
  .item.open > .head .tw { transform: rotate(90deg); }
  .item > .head .meta { color: var(--muted); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item > .body { overflow: hidden; min-height: 0;
                  padding: 0 8px; border-top: 0 solid var(--line);
                  transition: padding 160ms ease, border-top-width 160ms ease; }
  .item.open > .body { padding: 8px; border-top-width: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .item, .item > .body, .item > .head .tw { transition: none; }
  }
  .swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--line); vertical-align: -1px; }

  /* ---- buttons / status ---- */
  button.act {
    padding: 5px 9px; font: inherit; font-size: var(--fs-md); cursor: pointer;
    border: 1px solid var(--line); background: #fff; border-radius: 4px; color: var(--fg);
  }
  button.act:hover { background: #f1f3f4; }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act.danger { color: var(--err); }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .applogo { width: calc(var(--fs) * 2.4); height: calc(var(--fs) * 2.4);
             vertical-align: middle; margin-right: 8px; flex: 0 0 auto; }
  .customstyle { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .customstyle > button.act { flex: 0 1 auto; max-width: 60%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .customstyle > .meta { flex: 1 1 auto; color: var(--muted); font-size: var(--fs-xs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .customstyle > button.danger { flex: 0 0 auto; }

  .note { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 4px;
          padding: 6px 8px; font-size: var(--fs-sm); margin: 6px 0; }
  .note ul { margin: 4px 0 0 16px; padding: 0; }

  #status {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 5px 10px; font-size: var(--fs-sm);
    border-top: 1px solid var(--line); background: #f8f9fa; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.err { color: var(--err); background: #fce8e6; }
  #status.ok { color: var(--ok); }

  /* ---- tip / about, below the panels on every tab ---- */
  .tip { margin-top: 16px; }
  .tip .body a { color: var(--accent); }
  /* 80% of the sidebar itself, so vw rather than a percentage of the padded
     box it sits in. The image is square, so height follows. */
  .tipqr { width: 80vw; max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .tiplink { display: block; text-align: center; font-weight: 700;
             font-size: calc(var(--fs) * 1.15); margin: 12px 0 8px; text-decoration: none; }
  .tiplink:hover { text-decoration: underline; }

  textarea { width: 100%; height: 110px; font-family: Roboto Mono, Consolas, monospace;
             font-size: var(--fs-xs); border: 1px solid var(--line); border-radius: 3px; padding: 4px; }
</style>
