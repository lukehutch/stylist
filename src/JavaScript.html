/* =================================================================
 * Staying in step with the document
 *
 * Apps Script has no edit trigger for Docs -- onOpen and onInstall are the
 * only document triggers, and neither fires when someone reformats text --
 * so there is nothing to subscribe to. The sidebar polls instead: re-read
 * the document, and if it differs from what is on screen, re-render.
 *
 * The poll runs while you are typing. Everything on screen is overwritten
 * with what the document now says, with one exception: the field that has
 * the focus and holds something different from what the document last said
 * keeps its text and its caret, because that is a value you have not
 * finished typing. Every other field, including one you left half-typed and
 * clicked away from, goes back to the truth.
 * ================================================================= */

/* ---- how often ---------------------------------------------------
 * Two lanes. The meta panels (page setup, named styles) follow what a read
 * actually costs: wait twenty times the last read's duration, never under a
 * second, never over five, starting when the previous read finishes.
 *
 * The context panels (lists, tables, sections) cannot wait that out -- five
 * seconds between clicking into a list and seeing it is five seconds too
 * long. Their clock runs at CONTEXT_TICK_MS, but all it does each tick is
 * the cheap cursor probe, which reads nothing from the document; only a
 * changed answer spends a content read. One probe in flight at a time, and
 * a failed one backs off for a second rather than hammering.
 */
var POLL_MIN_MS = 1000;
var POLL_MAX_MS = 5000;
var POLL_DUTY = 20;
var CONTEXT_TICK_MS = 110;
var lastFetchMs = 0;

function nextPollDelay() {
  return Math.max(POLL_MIN_MS, Math.min(POLL_MAX_MS, lastFetchMs * POLL_DUTY));
}

function tickDelay() {
  if ((PANEL_SYNC[activePanel] || 'static') === 'context') {
    return Date.now() < probeWaitUntil ? POLL_MIN_MS : CONTEXT_TICK_MS;
  }
  return nextPollDelay();
}

/* ---- keeping the edit you are in the middle of -------------------- */

/**
 * Where a node sits, as the chain of child indexes down from <body>.
 *
 * renderAll builds the page from the data, so the same data puts the same
 * field in the same place; that is enough to find a field again on the other
 * side of a re-render. If the document changed shape -- a table added, a
 * section removed -- the path lands somewhere else or nowhere, and the edit
 * is dropped rather than pasted into whatever now sits there.
 */
function domPath(node) {
  var path = [];
  for (var n = node; n && n !== document.body; n = n.parentNode) {
    if (!n.parentNode) return null;                 // detached: no path to give
    path.unshift(Array.prototype.indexOf.call(n.parentNode.children, n));
  }
  return path;
}

function atPath(path) {
  var n = document.body;
  for (var i = 0; n && i < path.length; i++) n = n.children[path[i]];
  return n || null;
}

var rerendering = false;

/**
 * Whether the user has a picker open, and so nothing may be rebuilt under them.
 *
 * A native dropdown -- a <select>, a colour swatch, a font box backed by a
 * <datalist> -- is drawn by the browser and not by this page. Nothing in the
 * DOM says whether one is open, and replacing the element closes it with no
 * way to put it back: the poll would silently cancel a choice half made.
 *
 * Focus is the one signal available, and it is good enough, because a dropdown
 * cannot be open unless its control has focus. Erring the other way costs only
 * freshness, and only while the user is inside a control they are about to
 * change anyway -- the deferred read runs the moment focus leaves.
 */
function pickerOpen() {
  var a = document.activeElement;
  if (!a || !document.hasFocus()) return false;
  if (a.tagName === 'SELECT') return true;
  return a.tagName === 'INPUT' && (a.type === 'color' || a.hasAttribute('list'));
}

var pollDeferred = false;

function renderKeepingEdits() {
  var a = document.activeElement;
  var keep = null;
  // The focused field is found again either way. Whether its contents survive
  // is the separate question below: dirty means you have typed something the
  // document does not know about yet, and only that is worth keeping.
  if (document.hasFocus() && a && a.isDirty) {
    var path = domPath(a);
    if (path) {
      keep = { path: path, tag: a.tagName, dirty: a.isDirty(),
               value: a.value, checked: a.checked,
               start: a.selectionStart, end: a.selectionEnd };
    }
  }

  rerendering = true;
  try { renderAll(); } finally { rerendering = false; }

  if (!keep) return;
  var node = atPath(keep.path);
  if (!node || node.tagName !== keep.tag || !node.isDirty) return;
  if (keep.dirty) {
    node.value = keep.value;
    node.checked = keep.checked;
  }
  // Losing the focus every second because the document changed would make the
  // sidebar unusable, so it goes back whether or not anything was typed.
  node.focus();
  // Only text-like inputs have a selection; a number or colour input throws.
  try { node.setSelectionRange(keep.start, keep.end); } catch (e) { /* not text */ }
}

/* ---- what each panel needs to stay current ------------------------
 *
 * meta    -- page setup, named styles and the tab list. A masked response
 *            that never carries the body, so polling it costs the same on a
 *            200-page document as on a one-pager.
 * context -- the list or table under the cursor. A cheap probe says whether
 *            the cursor is still where it was; only when it has moved does
 *            anything content-shaped get read at all.
 * static  -- never read on the clock. Switching to the panel refreshes it,
 *            as does any write.
 * ------------------------------------------------------------------ */
var PANEL_SYNC = {
  page: 'meta', styles: 'meta',
  lists: 'context', tables: 'context', sections: 'context', hf: 'context',
  notes: 'static', presets: 'static'
};
var activePanel = 'page';

/** The last cursorContext answer, as JSON so it can be compared, and as the
 *  object itself so the content read that follows a change gets it verbatim. */
var lastCtx = null;
var lastCtxObj = null;
var probeWaitUntil = 0;
var probing = false;
var ctxRedraw = false;

function poll() {
  if (!S.data || S.busy || document.hidden) return Promise.resolve();
  // Skipped whole, not just the render: fetching here would move the
  // fingerprint on, and the change would then never be drawn at all.
  if (pickerOpen()) { pollDeferred = true; return Promise.resolve(); }

  var kind = PANEL_SYNC[activePanel] || 'static';
  var t0 = Date.now();
  var at = writes;

  var prep;
  if (kind === 'meta') {
    prep = Promise.resolve('meta');
  } else if (kind !== 'context') {
    prep = Promise.resolve(null);          // nothing to watch on the clock
  } else {
    // A few accessor calls to find out whether there is anything to read.
    // Only the cursor moving onto, off, or between lists, tables and
    // sections spends a content read. At the fast tick rate two probes could
    // overlap, and out-of-order answers would read the wrong thing after
    // them, so one at a time.
    if (probing) return Promise.resolve();
    probing = true;
    var kindBefore = S.ctx.segmentKind;
    prep = callRead('cursorContext').then(function (ctx) {
      probing = false;
      var now = JSON.stringify(ctx || {});
      if (now === lastCtx) return null;
      lastCtx = now;
      lastCtxObj = ctx || {};
      S.ctx = ctx || {};
      // The headers panel draws itself from the probe rather than from the
      // document -- whether the cursor is in a header decides what it offers.
      // A read would come back byte-identical and be discarded, so moving in
      // or out of one is a reason to re-draw in its own right.
      if (activePanel === 'hf' && S.ctx.segmentKind !== kindBefore) ctxRedraw = true;
      return activePanel;
    }, function (e) {
      probing = false;
      throw e;
    });
  }

  return prep
    .then(function (what) {
      if (!what) return null;
      // The sections and headers slices both need the probe's paragraph handle
      // to find the right section, and prefer whichever one the panel already
      // shows.
      var ctxArg = what === 'sections' || what === 'hf'
        ? Object.assign({}, lastCtxObj, { preferred: S.data.activeSectionIndex || 0 })
        : undefined;
      return callRead('refresh', [S.tabId, what, ctxArg]).then(function (slice) {
        lastFetchMs = Date.now() - t0;
        // A write went out while this read was in the air, so what came back
        // predates it. Drawing it would put the old value back on screen.
        if (at !== writes) return null;
        Object.keys(slice).forEach(function (k) { S.data[k] = slice[k]; });
        if (slice.activeTabId) S.tabId = slice.activeTabId;
        var fresh = JSON.stringify(S.data);
        if (fresh === S.fingerprint) return null;
        S.fingerprint = fresh;
        return true;
      });
    })
    .then(function (changed) {
      if (changed || ctxRedraw) renderKeepingEdits();
      ctxRedraw = false;
    })
    .catch(function () {
      /* transient: the next tick tries again -- after a pause, so a failing
         probe does not hammer the server at the fast tick rate. */
      probeWaitUntil = Date.now() + POLL_MIN_MS;
    });
}

/* ---- the clock ----------------------------------------------------
 * The schedule runs in a worker. That is as much of the poll as can leave the
 * main thread: google.script.run is injected into this page by the HtmlService
 * bootstrap and does not exist in a worker, and a worker has no parent frame
 * to postMessage through, so the read itself has to be issued here. What the
 * worker does buy is a timer that is not queued behind the sidebar's own
 * layout and rendering work.
 *
 * Apps Script serves no static files, so there is no URL to point a Worker at
 * and it is built from a blob instead. If the page's content security policy
 * refuses that, setTimeout does the same job on the main thread.
 *
 * Nothing keeps running once the sidebar is not on screen. Closing it destroys
 * this frame, which takes the timer and the worker with it, but that is the
 * browser tidying up after us rather than us stopping -- and it does not cover
 * the sidebar merely being hidden, which leaves the frame alive and polling a
 * document nobody is looking at. So the schedule is stopped explicitly:
 * hidden pauses it, and the frame going away terminates the worker outright.
 */
var scheduleNext = null;
var pollWorker = null;
var polling = false;

function startPolling() {
  var src = 'onmessage = function (e) { setTimeout(function () { postMessage(1); }, e.data); };';
  try {
    pollWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) {
    pollWorker = null;
  }

  if (pollWorker) {
    pollWorker.onmessage = tick;
    // A worker that dies takes the pending tick with it, so restart the chain
    // on the main thread rather than leaving the sidebar silently frozen.
    pollWorker.onerror = function () { pollWorker = null; setTimeout(tick, POLL_MIN_MS); };
    scheduleNext = function (ms) {
      if (pollWorker) pollWorker.postMessage(ms); else setTimeout(tick, ms);
    };
  } else {
    scheduleNext = function (ms) { setTimeout(tick, ms); };
  }

  polling = true;
  schedule();
}

function tick() { poll().then(schedule); }

/**
 * Every path back into the loop goes through here, so clearing `polling` is
 * enough to stop it: a timer already in flight still fires, finds the flag
 * down, and schedules nothing further.
 */
function schedule() { if (polling) scheduleNext(tickDelay()); }

/** Hidden, but still there: keep the worker, stop asking. */
function pausePolling() { polling = false; }

function resumePolling() {
  if (polling || !scheduleNext) return;
  polling = true;
  schedule();
}

/** Gone for good: give the worker back rather than leaking a thread. */
function stopPolling() {
  polling = false;
  if (pollWorker) {
    pollWorker.terminate();
    pollWorker = null;
  }
}

function switchTab(name) {
  ['page', 'styles', 'lists', 'tables', 'sections', 'hf', 'notes', 'presets'].forEach(function (n) {
    document.getElementById('panel-' + n).classList.toggle('active', n === name);
    document.getElementById('tab-' + n).classList.toggle('active', n === name);
  });
  // A panel you have just come back to should not wait out the clock, and a
  // context panel should not trust a cursor answer from before you left.
  activePanel = name;
  lastCtx = null;
  lastCtxObj = null;
  setTimeout(poll, 0);
}

function boot() {
  document.getElementById('unit').addEventListener('change', function (e) {
    S.unit = e.target.value;
    // Every dimension field, and every summary line that quotes one, is
    // rebuilt from the cached payload -- no server call, and nothing is left
    // showing the old unit.
    S.unitFields.forEach(function (f) {
      f.input.value = fromPt(f.input._pt, S.unit);
      f.input.setLive(f.input._pt);
      f.tag.textContent = S.unit.toLowerCase();
    });
    if (S.data) renderAll();
  });
  document.getElementById('doctab').addEventListener('change', function (e) {
    S.tabId = e.target.value || null;
    status('Loading tab…', '');
    reload().then(function () { status('', ''); });
  });
  ['page', 'styles', 'lists', 'tables', 'sections', 'hf', 'notes', 'presets'].forEach(function (n) {
    document.getElementById('tab-' + n).addEventListener('click', function () { switchTab(n); });
  });

  // Clicks on chrome controls -- buttons, fold headings -- do not move focus
  // into the sidebar. The document keeps the keyboard, so Ctrl+Z and
  // Ctrl+Shift+Z keep undoing and redoing there straight after any click.
  document.addEventListener('mousedown', function (e) {
    if (e.target.closest && e.target.closest('button, .item > .head')) e.preventDefault();
  });

  // Undo and redo belong to the document unless you are typing in a field of
  // the sidebar: then the browser's own undo of your typing is what you want.
  // Anywhere else in the sidebar has nothing to undo, so the keystroke is
  // handed back by putting focus where it was before you clicked -- the next
  // one reaches the document. (The sidebar frame cannot reach into Docs'
  // editing surface to replay this very keystroke; that surface is another
  // frame and cross-origin to this one.)
  window.addEventListener('keydown', function (e) {
    if (!((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'z' || e.key === 'Z'))) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.isContentEditable ||
              (a.tagName === 'INPUT' && a.type !== 'checkbox'))) return;
    e.preventDefault();
    try { window.parent.focus(); } catch (err) { /* best effort */ }
  });

  var tipItem = document.getElementById('tipItem');
  document.getElementById('tipHead').addEventListener('click', function () {
    tipItem.classList.toggle('open');
  });

  // Coming back to the sidebar after working in the document is the moment the
  // user most wants it to be current, and it is the closest thing to an edit
  // event this add-on can get: Docs offers no cursor or typing trigger, and a
  // server-side trigger could not reach an open sidebar anyway.
  window.addEventListener('focus', function () {
    // Coming back from working in the document is when the user most wants
    // the panel current, so spend one read on it even if the cursor has not
    // moved: text edited elsewhere in the same list or table would not show
    // otherwise.
    lastCtx = null;
    lastCtxObj = null;
    setTimeout(poll, 0);
  });

  // Capture, because blur does not bubble. This is what makes deferring cheap:
  // the read the picker held off happens as soon as the picker is done with.
  document.addEventListener('blur', function () {
    if (!pollDeferred) return;
    pollDeferred = false;
    setTimeout(poll, 0);
  }, true);

  // Closing the sidebar tears down this frame; hiding it does not. Cover both,
  // so the poll never outlives the panel the user was looking at.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pausePolling(); else resumePolling();
  });
  window.addEventListener('pagehide', stopPolling);
  window.addEventListener('unload', stopPolling);

  status('Loading document…', '');
  // The sidebar is an ordinary page in an iframe, so this reaches the browser
  // console -- pick the add-on's frame in the console's frame selector to see
  // it. Server-side Logger.log would go to the Apps Script execution log
  // instead, which is no help while looking at the sidebar.
  var firstReadT0 = Date.now();
  reload().then(function (data) {
    var firstReadMs = Date.now() - firstReadT0;
    console.log('Stylist: first load took ' + firstReadMs + ' ms round trip' +
      (data.timings ? ' — server ' + JSON.stringify(data.timings) : ''));
    // It is also a measurement of exactly what the poll pays, so the first
    // wait is paced by it rather than by the one-second floor.
    lastFetchMs = firstReadMs;
    var sel = document.getElementById('doctab');
    if (data.tabs.length > 1) {
      data.tabs.forEach(function (t) {
        var o = el('option', null, new Array(t.depth + 1).join('— ') + t.title);
        o.value = t.tabId;
        sel.appendChild(o);
      });
      sel.value = data.activeTabId;
      document.getElementById('tabRow').style.display = 'flex';
    }
    status('', '');
    startPolling();
  }).catch(function (e) {
    status('Could not load: ' + String((e && e.message) || e), 'err');
  });
}

document.addEventListener('DOMContentLoaded', boot);
</script>
