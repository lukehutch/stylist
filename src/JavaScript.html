<script>
/* =================================================================
 * State
 * ================================================================= */
var S = {
  data: null,          // last full loadAll payload
  unit: 'IN',          // display unit for dimension fields
  scope: 'all',        // every write covers all tabs; not user-selectable
  tabId: null,
  unitFields: [],      // dimension inputs to re-render when the unit changes
  open: {},            // which list items are expanded, so a re-render can restore them
  all: { lists: false, tables: false, sections: false },   // panels editing everything at once
  hfScope: 'all:both', // which headers and footers the headers panel writes to
  ctx: {},             // last cursorContext answer, for panels that key off it
  fingerprint: null,   // JSON of the last payload, to spot document-side changes
  busy: 0              // server calls in flight; polling stands aside while any are
};

var UNIT_TO_PT = { PT: 1, IN: 72, CM: 72 / 2.54, MM: 72 / 25.4 };
function toPt(v, u) { return Number(v) * UNIT_TO_PT[u]; }
/**
 * Points -> display value in unit `u`.
 *
 * Points and millimetres are fine-grained enough that a tenth is the useful
 * resolution. Inches and centimetres are not: three decimals there, except
 * that a value sitting within 0.0005 of a tenth or an eighth snaps to it, so
 * a half-inch margin reads 0.5 and not 0.499 or 0.5001.
 */
var SNAP_GRIDS = [0.1, 0.125];
var SNAP_TOL = 0.0005;

function fromPt(v, u) {
  if (v === null || v === undefined) return '';
  var raw = Number(v) / UNIT_TO_PT[u];
  if (!isFinite(raw)) return '';
  if (u === 'PT' || u === 'MM') return Math.round(raw * 10) / 10;
  for (var i = 0; i < SNAP_GRIDS.length; i++) {
    var g = SNAP_GRIDS[i];
    var snapped = Math.round(raw / g) * g;
    if (Math.abs(raw - snapped) <= SNAP_TOL) return Math.round(snapped * 1000) / 1000;
  }
  return Math.round(raw * 1000) / 1000;
}

/* =================================================================
 * Server bridge
 *
 * Writes are serialised: live apply fires on every field blur, and overlapping
 * batchUpdate calls against one document race in ways that are painful to
 * debug. One write in flight at a time.
 *
 * Reads are not in that queue. The poll re-reads the whole document, which on
 * a long one takes seconds, and a write that had to wait its turn behind one
 * would take seconds to reach the document -- so a click landing mid-poll goes
 * out immediately and the read it overtook is thrown away as stale.
 * ================================================================= */
var chain = Promise.resolve();
/** Bumped by every write, so a read issued before one lands is known stale. */
var writes = 0;

function rawCall(fn, args) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fn].apply(null, args || []);
  });
}

function call(fn, args) {
  S.busy++;
  writes++;
  armBusy();
  var p = chain.catch(function () {}).then(function () { return rawCall(fn, args); });
  chain = p.catch(function () {});
  p.then(done, done);
  function done() {
    S.busy--;
    // Not straight away: a write that is followed by a read -- most of them
    // are, since the reload comes off the write's own promise -- would drop
    // the veil in the gap between the two and raise it again half a second
    // later, which reads as two operations rather than one. The check runs
    // after the microtasks that queue the next call, so a chain keeps the one
    // veil it started with.
    if (S.busy <= 0) setTimeout(function () { if (S.busy <= 0) disarmBusy(); }, 0);
  }
  return p;
}

/** A read, which waits for nothing and holds nothing else up. */
function callRead(fn, args) {
  return rawCall(fn, args);
}

/**
 * The bar along the bottom of the sidebar, which is there only when it has
 * something to say -- and only ever says two kinds of thing.
 *
 * Errors, because a write that did not happen leaves nothing to look at. And
 * "working on it" for the two operations slow enough to look frozen, each of
 * which clears the bar itself when it finishes.
 *
 * Nothing else. Every field applies to the document as you leave it and the
 * poll brings changes back the other way, so a line reporting that something
 * worked is one more thing to read about a result already on screen. Calling
 * this with no message hides the bar.
 */
/**
 * A write that is taking longer than half a second takes the panel with it:
 * a veil goes over everything and an hourglass spins in the middle, until
 * the write settles. Reads never trigger it -- they hold nothing up.
 */
var BUSY_AFTER_MS = 500;
var busyTimer = null;

function busyShow(on) {
  var v = document.getElementById('busy');
  if (v) v.classList.toggle('on', !!on);
}

function armBusy() {
  if (busyTimer) return;
  busyTimer = setTimeout(function () {
    busyTimer = null;
    busyShow(true);
  }, BUSY_AFTER_MS);
}

function disarmBusy() {
  if (busyTimer) { clearTimeout(busyTimer); busyTimer = null; }
  busyShow(false);
}

function status(msg, kind) {
  var el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = kind || '';
  el.style.display = msg ? 'block' : 'none';
}

/* =================================================================
 * DOM helpers
 * ================================================================= */
/** A detached copy, so an editor's working model never mutates S.data. */
function copy(o) { return JSON.parse(JSON.stringify(o || {})); }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}

function fieldRow(labelText, control) {
  var row = el('div', 'field');
  row.appendChild(el('label', null, labelText));
  var ctl = el('div', 'ctl');
  (Array.isArray(control) ? control : [control]).forEach(function (c) { ctl.appendChild(c); });
  row.appendChild(ctl);
  return row;
}

/**
 * Live apply.
 *
 * `change` covers blur and Enter for text/number inputs and immediate
 * selection for selects and checkboxes; the extra keydown handler makes
 * Enter commit without waiting for focus to move. Tab commits via blur.
 * A field that fails validation is marked and never sent.
 */
/** What is actually in a field: a checkbox says checked, everything else value. */
function shownValue(input) {
  return input.type === 'checkbox' ? input.checked : input.value;
}

function bindCommit(input, validate, commit) {
  var lastSent;
  function attempt() {
    // Re-rendering removes this element from the page, and a browser may fire
    // change on the way out. Committing then would write a half-typed value
    // the user never confirmed.
    if (rerendering) return;
    var v = validate(input);
    if (v.error) {
      input.classList.add('invalid');
      input.title = v.error;
      status(v.error, 'err');
      return;
    }
    // A field with no inherited value to fall back on answers junk with its
    // default rather than with a refusal, so the box shows what the document
    // is about to get, and stays marked until the next keystroke.
    if (v.show !== undefined) input.value = v.show;
    if (v.bad) {
      input.classList.add('invalid');
      input.title = v.bad;
      status(v.bad, 'err');
    } else {
      input.classList.remove('invalid');
      input.title = '';
    }
    if (v.skip) return;
    var key = JSON.stringify(v.value);
    if (key === lastSent) { input.__live = shownValue(input); return; }  // nothing changed
    lastSent = key;
    // What was on screen when the write went out. Reading it back when the
    // write resolves would call the field clean against text typed since.
    var sent = shownValue(input);
    input.classList.add('saving');
    Promise.resolve(commit(v.value))
      .then(function () {
        input.classList.remove('saving');
        input.__live = sent;   // the document says this now
      })
      .catch(function (e) {
        input.classList.remove('saving');
        lastSent = undefined;
        status(String((e && e.message) || e), 'err');
      });
  }
  input.addEventListener('change', attempt);
  // Typing is the acknowledgement: whatever the last value was flagged for,
  // the mark goes as soon as the field is being worked on again.
  input.addEventListener('input', function () {
    input.classList.remove('invalid');
    input.title = '';
  });
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); attempt(); input.blur(); }
  });
  /**
   * Dirty means what is in the box differs from what the document last said --
   * compared, not remembered. A flag set on the first keystroke would still
   * call a field dirty after you typed a digit and deleted it again, and the
   * poll would then leave a field alone that has nothing in it worth keeping.
   */
  input.isDirty = function () { return shownValue(input) !== input.__live; };
  input.setLive = function (val) {
    lastSent = JSON.stringify(val);
    input.__live = shownValue(input);
  };
  return input;
}

/* ---- field constructors ---------------------------------------- */

/**
 * Emptying a box and pressing Enter.
 *
 * Where the property can be inherited, that has to reach the document: the
 * box says "inherit" once it is empty, and until the value is actually
 * unset server-side the box is lying. `opts.clearable` marks those fields,
 * and they commit null -- which the writers turn into a field named in the
 * mask with no value, the Docs API's way of saying "back to inherited".
 *
 * Fields with a real default rather than an inherited one are left alone:
 * emptying them means nothing, so they keep the old no-op.
 */
/**
 * Defaults for the fields that cannot be left unset.
 *
 * A page margin, a cell padding, a border width: none of these inherit from
 * anywhere, so there is no such thing as "not set" for them -- whatever is in
 * the box is what the document gets. Emptying one therefore has to mean
 * something, and the only sensible something is the value a fresh Google Doc
 * would have. Points throughout, since that is what the writers take.
 */
var DEFAULTS = {
  pageWidthPt: 612,        // Letter, the size a new Google Doc comes with
  pageHeightPt: 792,
  pageMarginPt: 72,        // 1 in
  headerFooterMarginPt: 36,   // 0.5 in
  columnGapPt: 36,         // 0.5 in
  columnCount: 1,
  pageNumberStart: 1,
  cellPaddingPt: 5,        // Docs' own 0.069 in
  borderWidthPt: 1,
  borderPaddingPt: 0,
  minRowHeightPt: 0,
  pinnedHeaderRows: 0
};

/**
 * The width columns have to share: the page less its side margins.
 *
 * There is no fixed default for a column width -- it depends on the page it
 * sits on -- so the default is the width the columns would have if they split
 * the text area evenly, which is what a column layout starts as anyway.
 * Sections carry their own margins; where one is not set the page's stands.
 */
function textWidthPt(marginLeftPt, marginRightPt) {
  var pf = (S.data && S.data.pageFormat) || {};
  function pick(a, b) {
    if (a !== null && a !== undefined) return a;
    if (b !== null && b !== undefined) return b;
    return DEFAULTS.pageMarginPt;
  }
  var w = pf.pageWidthPt || DEFAULTS.pageWidthPt;
  return Math.max(1, w - pick(marginLeftPt, pf.marginLeftPt) - pick(marginRightPt, pf.marginRightPt));
}

/**
 * What a number typed into a field means.
 *
 * Three cases, and which one a field gets depends on what it is. A field
 * whose value can come from a named style is `clearable`: empty means "put it
 * back to inherited" and that is written through. A field with a `def` has
 * nowhere to inherit from, so empty means the default, and so does anything
 * that is not a number at all -- with the box marked, so a typo that quietly
 * became 1 in does not pass unnoticed. A field with neither leaves the
 * document alone when empty, and refuses junk outright.
 *
 * Out of range is never a typo in the same way: a width of -3 is a number,
 * just not a usable one, so it is refused rather than replaced.
 */
function numeric(raw, opts, def) {
  if (raw === '') {
    if (opts.clearable) return { value: null };
    if (def === undefined) return { skip: true };
    return { value: def, show: true };
  }
  var n = Number(raw);
  if (!isFinite(n)) {
    if (def === undefined) return { error: '"' + raw + '" is not a number' };
    return { value: def, show: true, bad: '"' + raw + '" is not a number. Using the default instead.' };
  }
  if (opts.min !== undefined && n < opts.min) return { error: 'Must be at least ' + opts.min };
  if (opts.max !== undefined && n > opts.max) return { error: 'Must be at most ' + opts.max };
  if (opts.integer && Math.round(n) !== n) return { error: 'Must be a whole number' };
  return { value: n };
}

/** Dimension field: displayed in the current unit, committed in points. */
function numUnit(valuePt, commitPt, opts) {
  opts = opts || {};
  var input = el('input');
  input.type = 'text';
  input.value = fromPt(valuePt, S.unit);
  // An empty dimension box means the value comes from somewhere else -- the
  // named style, the document default -- so say so rather than looking unset.
  input.placeholder = opts.placeholder || 'inherit';
  input._pt = valuePt;
  var unitTag = el('span', 'unit', S.unit.toLowerCase());

  bindCommit(input, function (i) {
    // The default is held in points; the box speaks the chosen unit, so it is
    // compared and shown in that unit and converted back like any other value.
    var def = opts.def === undefined ? undefined : Number(fromPt(opts.def, S.unit));
    var v = numeric(i.value.trim(), opts, def);
    if (v.error || v.skip || v.value === null) return v;
    return { value: toPt(v.value, S.unit), show: v.show ? String(def) : undefined, bad: v.bad };
  }, function (pt) {
    input._pt = pt;
    return commitPt(pt);
  });
  input.setLive(valuePt);

  S.unitFields.push({ input: input, tag: unitTag });
  return [input, unitTag];
}

/** Plain point field, for sizes Docs itself always states in points. */
function numPt(value, commit, opts) {
  opts = opts || {};
  var input = el('input');
  input.type = 'text';
  input.value = (value === null || value === undefined) ? '' : value;
  input.placeholder = opts.placeholder || 'inherit';
  var tag = el('span', 'unit', 'pt');
  bindCommit(input, function (i) {
    var v = numeric(i.value.trim(), opts, opts.def);
    if (v.show) v.show = String(opts.def);
    return v;
  }, commit);
  input.setLive(value);
  return [input, tag];
}

/** Unitless number (line spacing multiplier, page number, counts). */
function numPlain(value, commit, opts) {
  opts = opts || {};
  var input = el('input');
  input.type = 'text';
  input.value = (value === null || value === undefined) ? '' : value;
  input.placeholder = opts.placeholder || 'default';
  bindCommit(input, function (i) {
    var v = numeric(i.value.trim(), opts, opts.def);
    if (v.show) v.show = String(opts.def);
    return v;
  }, commit);
  input.setLive(value);
  return input;
}

function selectField(options, value, commit, opts) {
  opts = opts || {};
  var sel = el('select');
  options.forEach(function (o) {
    var opt = el('option', null, o.label);
    opt.value = o.id;
    sel.appendChild(opt);
  });
  sel.value = value || '';
  // Some of these menus open with an entry that is not a choice -- "Custom..."
  // on the page size, which names what the dimensions already are rather than
  // anything to apply. Picking it has to leave no trace, or the menu forgets
  // what the document last got and picking the original entry back writes it
  // out again for nothing.
  bindCommit(sel, function (i) {
    if (opts.skipBlank && !i.value) return { skip: true };
    return { value: i.value };
  }, commit);
  sel.setLive(value || '');
  // Wrapped, because the arrow is drawn by .combo::after painting over the top
  // of the control rather than by the browser painting inside it. Callers only
  // ever hand this straight to fieldRow, so the wrapper is transparent to them.
  var combo = el('span', 'combo');
  combo.appendChild(sel);
  return combo;
}

/**
 * `face` is a class put on the label text, so a checkbox that turns an
 * effect on can show its own name wearing that effect. `labelText` may also
 * be an element, for a label only part of which wears the effect.
 */
/**
 * The font picker.
 *
 * A real <select>, not a text box with a datalist behind it: a datalist
 * cannot draw each name in the font it names, and it filters as you type
 * rather than showing what is on offer.
 *
 * Docs accepts any Google Fonts family, not only the ones listed, so a
 * document already set to a font off the list keeps it as its own option at
 * the top rather than being quietly rewritten to the nearest name in the
 * menu.
 */
function fontField(current, commit) {
  var fonts = (S.data && S.data.constants && S.data.constants.fonts) || [];
  if (current && fonts.indexOf(current) === -1) fonts = [current].concat(fonts);
  var sel = el('select');
  var blank = el('option', null, 'inherit');
  blank.value = '';
  sel.appendChild(blank);
  fonts.forEach(function (f) {
    var o = el('option', 'fontface', f);
    o.value = f;
    o.style.fontFamily = '"' + f + '"';
    sel.appendChild(o);
  });
  sel.value = current || '';
  bindCommit(sel, function (i) { return { value: i.value || null }; }, commit);
  sel.setLive(current || '');
  var combo = el('span', 'combo');
  combo.appendChild(sel);
  return combo;
}

function checkField(labelText, value, commit, face) {
  var wrap = el('label');
  var box = el('input');
  box.type = 'checkbox';
  box.checked = !!value;
  bindCommit(box, function (i) { return { value: i.checked }; }, commit);
  box.setLive(!!value);
  wrap.appendChild(box);
  if (labelText && labelText.nodeType) {
    wrap.appendChild(labelText);
  } else if (face) {
    var span = el('span', 'face ' + face);
    span.textContent = labelText;
    wrap.appendChild(span);
  } else {
    wrap.appendChild(document.createTextNode(labelText));
  }
  return wrap;
}

/**
 * Colour field. The Docs API models "no colour" as an empty OptionalColor,
 * which is distinct from black, so a clear button is a real control here.
 */
/**
 * A colour swatch and a "none" button beside it.
 *
 * `opts.blank` is what the swatch shows when the document has no colour set
 * here, and what it changes to when "none" is pressed. A colour input has no
 * way to render "unset", so it has to render the colour the document will
 * actually come out as: white for a page background, black for text.
 */
function colorField(hex, commit, opts) {
  opts = opts || {};
  var blank = opts.blank || '#000000';
  var input = el('input');
  input.type = 'color';
  input.value = hex || blank;
  // What the document holds, which is not what the swatch shows: with no
  // colour set the swatch has to show something, and picking that same colour
  // deliberately is a real change -- from nothing to that colour -- so the
  // document's null is what a pick is compared against.
  var none = !hex;
  bindCommit(input, function (i) { return { value: i.value }; }, function (v) {
    none = false;
    return commit(v);
  });
  input.setLive(hex || null);

  var clear = el('button', 'act', 'none');
  clear.title = opts.noneTitle || 'Clear the color (transparent / inherit)';
  clear.addEventListener('click', function () {
    if (none) return;              // already no colour: nothing to write
    none = true;
    input.value = blank;
    input.setLive(null);
    Promise.resolve(commit(''));
  });
  return [input, clear];
}
</script>
<script>
/* =================================================================
 * Enumerations mirrored from the Docs API
 * ================================================================= */
/**
 * The blank first option on a style select.
 *
 * It is both a display and a control. Shown, it means the value is not set
 * here and comes from the named style or the document default. Chosen, it
 * resets the property: the write names the field in its mask but sends no
 * value, which is how the Docs API asks for the inherited value back.
 */
var INHERIT = { id: '', label: 'Inherit' };

var ALIGNMENTS = [
  { id: 'START', label: 'Left / start' }, { id: 'CENTER', label: 'Centre' },
  { id: 'END', label: 'Right / end' }, { id: 'JUSTIFIED', label: 'Justified' }
];
var BASELINES = [
  { id: 'NONE', label: 'Normal' }, { id: 'SUPERSCRIPT', label: 'Superscript' },
  { id: 'SUBSCRIPT', label: 'Subscript' }
];
var DIRECTIONS = [
  { id: 'LEFT_TO_RIGHT', label: 'Left to right' }, { id: 'RIGHT_TO_LEFT', label: 'Right to left' }
];
var SPACING_MODES = [
  { id: 'COLLAPSE_LISTS', label: 'Collapse space in lists' },
  { id: 'NEVER_COLLAPSE', label: 'Never collapse space' }
];
var DASH_STYLES = [
  { id: 'SOLID', label: 'Solid' }, { id: 'DOT', label: 'Dotted' }, { id: 'DASH', label: 'Dashed' }
];
var CONTENT_ALIGNMENTS = [
  { id: 'TOP', label: 'Top' }, { id: 'MIDDLE', label: 'Middle' }, { id: 'BOTTOM', label: 'Bottom' }
];
var WEIGHTS = [100, 200, 300, 400, 500, 600, 700, 800, 900].map(function (w) {
  return { id: String(w), label: String(w) + (w === 400 ? ' (normal)' : w === 700 ? ' (bold)' : '') };
});
var BORDER_SIDES = [
  { key: 'borderTop', label: 'Top' }, { key: 'borderBottom', label: 'Bottom' },
  { key: 'borderLeft', label: 'Left' }, { key: 'borderRight', label: 'Right' },
  { key: 'borderBetween', label: 'Between' }
];

/* =================================================================
 * Style editor: every character and paragraph attribute the API exposes
 *
 * `model` is mutated in place. `commit` receives only the one field you just
 * changed, because that is the smallest edit that says what you meant: the
 * field mask is built from the keys present, so a payload of one key changes
 * one property and leaves every other attribute of the target alone. Sending
 * the whole model instead would rewrite attributes nobody touched, and would
 * turn values that were merely inherited into values explicitly set.
 * ================================================================= */
var FIELD_LABELS = {
  fontFamily: 'font', fontWeight: 'weight', fontSizePt: 'size',
  bold: 'bold', italic: 'italic', underline: 'underline',
  strikethrough: 'strikethrough', smallCaps: 'small caps',
  baselineOffset: 'super/subscript', foregroundColor: 'text color',
  backgroundColor: 'highlight', alignment: 'alignment', direction: 'direction',
  spacingMode: 'spacing mode', lineSpacing: 'line spacing',
  spaceAbovePt: 'space above', spaceBelowPt: 'space below',
  indentStartPt: 'indent start', indentEndPt: 'indent end',
  indentFirstLinePt: 'first-line indent', shadingColor: 'shading',
  keepLinesTogether: 'keep lines together', keepWithNext: 'keep with next',
  avoidWidowAndOrphan: 'stranded lines', pageBreakBefore: 'page break before',
  borderTop: 'top border', borderBottom: 'bottom border', borderLeft: 'left border',
  borderRight: 'right border', borderBetween: 'border between',
  contentAlignment: 'cell alignment', paddingTopPt: 'padding top',
  paddingBottomPt: 'padding bottom', paddingLeftPt: 'padding left',
  paddingRightPt: 'padding right', tabStops: 'tab stops'
};
function fieldLabel(key) { return FIELD_LABELS[key] || key; }

/**
 * The one property that just changed, and nothing else.
 *
 * The server builds its field mask from the keys present, so a payload of one
 * key changes one property and leaves every other attribute of the target
 * exactly as it was -- including the ones that are inherited rather than set,
 * which sending a whole model would freeze into place.
 */
function stylePayload(model, where, key) {
  var payload = { textStyle: {}, paragraphStyle: {} };
  payload[where][key] = model[where][key];
  // Family and weight are one message to the API, so neither travels alone.
  if (where === 'textStyle' && (key === 'fontFamily' || key === 'fontWeight')) {
    payload.textStyle.fontFamily = model.textStyle.fontFamily;
    payload.textStyle.fontWeight = model.textStyle.fontWeight || 400;
  }
  return payload;
}

function buildStyleEditor(model, commit, opts) {
  opts = opts || {};
  model.textStyle = model.textStyle || {};
  model.paragraphStyle = model.paragraphStyle || {};
  var root = el('div');

  // A caveat about what this editor can and cannot reach, where there is
  // one worth stating. Which fields are blank is already on the screen; why
  // a blank one is blank is not.
  if (opts.caveat) root.appendChild(el('p', 'hint', opts.caveat));
  if (opts.mixed && opts.mixed.length) {
    root.appendChild(el('p', 'hint',
      'Blank fields differ across this content. Setting one applies it to all of it.'));
  }

  function fire(where, k) { return commit(stylePayload(model, where, k)); }
  function setT(k, v) { model.textStyle[k] = v; return fire('textStyle', k); }
  function setP(k, v) { model.paragraphStyle[k] = v; return fire('paragraphStyle', k); }

  var what = opts.what || '';

  /* ---- character ---- */
  if (opts.character !== false) {
    var cFold = styleFold(what, 'character style', 'sfold:' + what + ':char');
    root.appendChild(cFold.item);
    var gChar = cFold.body;

    gChar.appendChild(fieldRow('Font', fontField(model.textStyle.fontFamily,
      function (v) { return setT('fontFamily', v); })));

    gChar.appendChild(fieldRow('Weight', selectField(WEIGHTS,
      String(model.textStyle.fontWeight || 400),
      function (v) { return setT('fontWeight', Number(v)); })));

    gChar.appendChild(fieldRow('Size', numPt(model.textStyle.fontSizePt,
      function (v) { return setT('fontSizePt', v); }, { min: 1, clearable: true })));

    var effects = el('div', 'checks');
    [['bold', 'Bold'], ['italic', 'Italic'], ['underline', 'Underline'],
     ['strikethrough', 'Strikethrough'], ['smallCaps', 'Small Caps']].forEach(function (p) {
      effects.appendChild(checkField(p[1], model.textStyle[p[0]],
        function (v) { return setT(p[0], v); }, p[0]));
    });

    // Superscript and subscript are two values of one API property, so the
    // boxes exclude each other and the Offset select shows the same thing.
    // Whichever control you use moves the others, so they never disagree --
    // and the select stays because it is the only one of them that can say
    // "inherit", which is a different thing from "normal".
    var offsetSel = null;
    var offsetBoxes = {};
    function setOffset(v) {
      if (offsetSel) offsetSel.value = v || '';
      Object.keys(offsetBoxes).forEach(function (k) {
        var b = offsetBoxes[k];
        b.checked = (k === v);
        b.setLive(b.checked);
      });
      return setT('baselineOffset', v || null);
    }
    // The word at its ordinary size with a single asterisk carrying the
    // effect: putting the whole label in superscript made it unreadably
    // small, and shrank the one thing it was meant to demonstrate.
    [['SUPERSCRIPT', 'Superscript', 'sup'], ['SUBSCRIPT', 'Subscript', 'sub']].forEach(function (p) {
      var label = el('span');
      label.appendChild(document.createTextNode(p[1]));
      label.appendChild(el('span', 'face ' + p[2], '*'));
      var f = checkField(label, model.textStyle.baselineOffset === p[0], function (on) {
        return setOffset(on ? p[0] : 'NONE');
      });
      offsetBoxes[p[0]] = f.querySelector('input');
      effects.appendChild(f);
    });
    gChar.appendChild(effects);

    offsetSel = selectField([INHERIT].concat(BASELINES),
      model.textStyle.baselineOffset || '',
      function (v) { return setOffset(v); }).querySelector('select');
    gChar.appendChild(fieldRow('Offset', offsetSel.parentNode));

    gChar.appendChild(fieldRow('Text color', colorField(model.textStyle.foregroundColor,
      function (v) { return setT('foregroundColor', v); })));
    gChar.appendChild(fieldRow('Highlight', colorField(model.textStyle.backgroundColor,
      function (v) { return setT('backgroundColor', v); },
      { blank: '#ffffff', noneTitle: 'No highlight' })));
  }

  /* ---- paragraph ---- */
  if (opts.paragraph !== false) {
    var pFold = styleFold(what, 'paragraph style', 'sfold:' + what + ':para');
    root.appendChild(pFold.item);
    var gPara = pFold.body;

    gPara.appendChild(fieldRow('Alignment', selectField([INHERIT].concat(ALIGNMENTS),
      model.paragraphStyle.alignment || '',
      function (v) { return setP('alignment', v || null); })));

    // Docs stores line spacing as a percentage where normal is 100.
    gPara.appendChild(fieldRow('Line spacing', numPlain(
      model.paragraphStyle.lineSpacing === undefined ? '' : model.paragraphStyle.lineSpacing / 100,
      function (v) { return setP('lineSpacing', v === null ? null : v * 100); },
      { min: 0.1, placeholder: 'inherit', clearable: true })));

    gPara.appendChild(fieldRow('Space above', numUnit(model.paragraphStyle.spaceAbovePt,
      function (v) { return setP('spaceAbovePt', v); }, { min: 0, clearable: true })));
    gPara.appendChild(fieldRow('Space below', numUnit(model.paragraphStyle.spaceBelowPt,
      function (v) { return setP('spaceBelowPt', v); }, { min: 0, clearable: true })));

    gPara.appendChild(fieldRow('Spacing mode', selectField([INHERIT].concat(SPACING_MODES),
      model.paragraphStyle.spacingMode || '',
      function (v) { return setP('spacingMode', v || null); })));

    gPara.appendChild(fieldRow('Indent left', numUnit(model.paragraphStyle.indentStartPt,
      function (v) { return setP('indentStartPt', v); }, { clearable: true })));
    gPara.appendChild(fieldRow('Indent right', numUnit(model.paragraphStyle.indentEndPt,
      function (v) { return setP('indentEndPt', v); }, { clearable: true })));
    gPara.appendChild(fieldRow('First line', numUnit(model.paragraphStyle.indentFirstLinePt,
      function (v) { return setP('indentFirstLinePt', v); }, { clearable: true })));

    gPara.appendChild(fieldRow('Direction', selectField([INHERIT].concat(DIRECTIONS),
      model.paragraphStyle.direction || '',
      function (v) { return setP('direction', v || null); })));

    var flow = el('div', 'checks');
    [['keepLinesTogether', 'Keep lines together'], ['keepWithNext', 'Keep with next'],
     ['avoidWidowAndOrphan', 'No stranded lines'], ['pageBreakBefore', 'Page break before']]
      .forEach(function (p) {
        // The API rejects page_break_before in headers, footers and footnotes.
        if (p[0] === 'pageBreakBefore' && opts.noPageBreak) return;
        var box = checkField(p[1], model.paragraphStyle[p[0]], function (v) { return setP(p[0], v); });
        if (p[0] === 'avoidWidowAndOrphan') {
          box.title = 'Never leave the first or last line of a paragraph on its ' +
            'own at the bottom or top of a page. Known elsewhere as widow and ' +
            'orphan control.';
        }
        flow.appendChild(box);
      });
    gPara.appendChild(flow);

    gPara.appendChild(fieldRow('Shading', colorField(model.paragraphStyle.shadingColor,
      function (v) { return setP('shadingColor', v); },
      { blank: '#ffffff', noneTitle: 'No shading' })));

    /* ---- borders ---- */
    var bItem = el('div', 'item');
    var bHead = el('div', 'head');
    bHead.appendChild(el('span', 'tw'));
    bHead.appendChild(el('span', 'name', 'Paragraph borders'));
    bHead.addEventListener('click', function () { bItem.classList.toggle('open'); });
    var bBody = el('div', 'body');
    BORDER_SIDES.forEach(function (side) {
      var gSide = group(side.label, 'narrow');
      bBody.appendChild(gSide);
      var cur = model.paragraphStyle[side.key] || {};
      function setB(k, v) {
        var b = model.paragraphStyle[side.key] || (model.paragraphStyle[side.key] = {});
        b[k] = v;
        // A border is one paragraphStyle field, so the whole side travels
        // together; that is already the smallest edit the API can express.
        return fire('paragraphStyle', side.key);
      }
      gSide.appendChild(fieldRow('Width', numPt(cur.widthPt,
        function (v) { return setB('widthPt', v); },
        { min: 0, def: DEFAULTS.borderWidthPt })));
      gSide.appendChild(fieldRow('Padding', numPt(cur.paddingPt,
        function (v) { return setB('paddingPt', v); },
        { min: 0, def: DEFAULTS.borderPaddingPt })));
      gSide.appendChild(fieldRow('Color', colorField(cur.color,
        function (v) { return setB('color', v); })));
      gSide.appendChild(fieldRow('Dash', selectField(DASH_STYLES, cur.dashStyle || 'SOLID',
        function (v) { return setB('dashStyle', v); })));
    });
    bItem.appendChild(bHead);
    bItem.appendChild(bBody);
    gPara.appendChild(bItem);
  }

  return root;
}

/**
 * A rounded box for a set of related controls, with its heading sitting in
 * the top edge. That is a fieldset with a legend, so nothing has to fake the
 * gap in the border. Append the controls to what this returns.
 */
/**
 * The "apply to all" switch at the head of the Lists, Tables and Sections
 * panels.
 *
 * Ticking it does three things in one go. Everything is first brought into
 * line with the formatting most of them already have, so the document starts
 * from a state it largely had already rather than from one table's look
 * imposed on the rest. The editor below then shows those settled values,
 * because it reads them back from the document like it always does. And from
 * then on every change goes to all of them.
 *
 * Unticking it changes nothing in the document; it just points the editor back
 * at the one thing the cursor is in.
 *
 * It is offered even where the document holds only one of the thing, because
 * the other half of what it does still matters there: with it ticked the
 * editor stops needing the cursor to be inside the thing being edited.
 */
function applyAllSwitch(kind, label, unifyFn, unifyArgs) {
  var wrap = el('div', 'checks applyall');
  wrap.appendChild(checkField(label, S.all[kind], function (on) {
    S.all[kind] = on;
    if (!on) { renderAll(); return; }
    status('Bringing them into line…', '');
    var args = copy(unifyArgs || {});
    args.tabId = S.tabId;
    return call(unifyFn, [args])
      .then(function () { status('', ''); return reload(); })
      .catch(function (e) { status(String(e.message || e), 'err'); });
  }));
  return wrap;
}

/**
 * One half of a style editor, folded away until asked for.
 *
 * Both halves are long, and a visit almost always changes one thing in one
 * of them, so they arrive shut with their names on the outside. `what` names
 * what is being styled, so a header reads "Heading 1 character style" rather
 * than a bare "Character" repeated down the panel.
 */
function styleFold(what, half, key) {
  var item = el('div', 'item');
  var head = el('div', 'head');
  head.appendChild(el('span', 'tw'));
  head.appendChild(el('span', 'name', (what ? what + ' ' : '') + half));
  var body = el('div', 'body');
  head.addEventListener('click', function () {
    item.classList.toggle('open');
    S.open[key] = item.classList.contains('open');
  });
  item.appendChild(head);
  item.appendChild(body);
  if (S.open[key]) item.classList.add('open');
  return { item: item, body: body };
}

function group(title, extra) {
  var g = el('fieldset', 'group' + (extra ? ' ' + extra : ''));
  g.appendChild(el('legend', null, title));
  return g;
}

/** Collapsible list row used by every panel that shows "a list of things". */
/**
 * Collapsible list row. `key` identifies the row across re-renders -- the
 * background poll rebuilds every panel, and rows that were open stay open.
 */
function listItem(name, meta, buildBody, key) {
  key = key || name;
  var item = el('div', 'item');
  var head = el('div', 'head');
  head.appendChild(el('span', 'tw'));   // turnstile arrow; CSS rotates it when open
  head.appendChild(el('span', 'name', name));
  head.appendChild(el('span', 'meta', meta || ''));
  var body = el('div', 'body');
  var built = false;
  function expand() {
    if (!built) { body.appendChild(buildBody()); built = true; }
  }
  head.addEventListener('click', function () {
    expand();
    item.classList.toggle('open');
    S.open[key] = item.classList.contains('open');
  });
  item.appendChild(head);
  item.appendChild(body);
  if (S.open[key]) { expand(); item.classList.add('open'); }
  return item;
}
</script>
<script>
/* =================================================================
 * Panel: Page setup
 * ================================================================= */
function renderPage() {
  var host = document.getElementById('panel-page');
  host.innerHTML = '';
  var pf = S.data.pageFormat;

  host.appendChild(el('h2', null, 'Page size'));
  var presets = [{ id: '', label: 'Custom…' }].concat(
    S.data.constants.pageSizePresets.map(function (p) { return { id: p.id, label: p.label }; }));
  var match = '';
  S.data.constants.pageSizePresets.forEach(function (p) {
    if (Math.abs((pf.pageWidthPt || 0) - p.widthPt) < 1 && Math.abs((pf.pageHeightPt || 0) - p.heightPt) < 1) match = p.id;
  });
  host.appendChild(fieldRow('Preset', selectField(presets, match, function (v) {
    var p = S.data.constants.pageSizePresets.filter(function (x) { return x.id === v; })[0];
    return applyPage({ pageWidthPt: p.widthPt, pageHeightPt: p.heightPt }).then(reload);
  }, { skipBlank: true })));
  host.appendChild(fieldRow('Width', numUnit(pf.pageWidthPt,
    function (v) { return applyPage({ pageWidthPt: v, pageHeightPt: pf.pageHeightPt }); },
    { min: 1, def: DEFAULTS.pageWidthPt })));
  host.appendChild(fieldRow('Height', numUnit(pf.pageHeightPt,
    function (v) { return applyPage({ pageWidthPt: pf.pageWidthPt, pageHeightPt: v }); },
    { min: 1, def: DEFAULTS.pageHeightPt })));

  var orient = el('div', 'checks');
  orient.appendChild(checkField('Landscape (flip dimensions)', pf.flipPageOrientation,
    function (v) { return applyPage({ flipPageOrientation: v }); }));
  host.appendChild(orient);

  host.appendChild(el('h2', null, 'Margins'));
  [['marginTopPt', 'Top'], ['marginBottomPt', 'Bottom'],
   ['marginLeftPt', 'Left'], ['marginRightPt', 'Right']].forEach(function (m) {
    host.appendChild(fieldRow(m[1], numUnit(pf[m[0]], function (v) {
      var p = {}; p[m[0]] = v; return applyPage(p);
    }, { min: 0, def: DEFAULTS.pageMarginPt })));
  });

  host.appendChild(el('h2', null, 'Document'));
  host.appendChild(fieldRow('Page numbers from', numPlain(pf.pageNumberStart,
    function (v) { return applyPage({ pageNumberStart: v }); },
    { min: 0, integer: true, def: DEFAULTS.pageNumberStart })));
  host.appendChild(fieldRow('Mode', selectField(
    [{ id: 'PAGES', label: 'Pages' }, { id: 'PAGELESS', label: 'Pageless' }],
    pf.documentMode, function (v) { return applyPage({ documentMode: v }).then(reload); })));
  host.appendChild(fieldRow('Background', colorField(pf.backgroundColor,
    function (v) { return applyPage({ backgroundColor: v }); },
    { blank: '#ffffff', noneTitle: 'Back to the default white page' })));
}

/** Where a section starts and how it is laid out, in words rather than enums. */
function sectionMeta(sec) {
  var starts = sec.sectionType === 'NEXT_PAGE' ? 'starts a new page' : 'same page';
  var n = sec.columnCount || 1;
  return starts + ' · ' + n + (n === 1 ? ' column' : ' columns');
}

function sectionBody(sec) {
  var box = el('div');
  function put(patch) {
    patch.tabId = S.tabId;
    patch.startIndex = sec.startIndex;
    patch.applyAll = !!S.all.sections;
    return call('writeSection', [patch]);
  }
  var gSec = group('Margins and layout');
  box.appendChild(gSec);
  [['marginTopPt', 'Top', DEFAULTS.pageMarginPt],
   ['marginBottomPt', 'Bottom', DEFAULTS.pageMarginPt],
   ['marginLeftPt', 'Left', DEFAULTS.pageMarginPt],
   ['marginRightPt', 'Right', DEFAULTS.pageMarginPt],
   ['marginHeaderPt', 'Header', DEFAULTS.headerFooterMarginPt],
   ['marginFooterPt', 'Footer', DEFAULTS.headerFooterMarginPt]]
    .forEach(function (m) {
      gSec.appendChild(fieldRow(m[1], numUnit(sec[m[0]], function (v) {
        var p = {}; p[m[0]] = v; return put(p);
      }, { min: 0, def: m[2] })));
    });
  gSec.appendChild(fieldRow('Direction', selectField(DIRECTIONS, sec.contentDirection,
    function (v) { return put({ contentDirection: v }); })));
  gSec.appendChild(fieldRow('Col separator', selectField(
    [{ id: 'NONE', label: 'None' }, { id: 'BETWEEN_EACH_COLUMN', label: 'Line between columns' }],
    sec.columnSeparatorStyle, function (v) { return put({ columnSeparatorStyle: v }); })));
  gSec.appendChild(fieldRow('Page numbers from', numPlain(sec.pageNumberStart,
    function (v) { return put({ pageNumberStart: v }); },
    { min: 0, integer: true, def: DEFAULTS.pageNumberStart })));
  var checks = el('div', 'checks');
  checks.appendChild(checkField('Landscape', sec.flipPageOrientation,
    function (v) { return put({ flipPageOrientation: v }); }));
  checks.appendChild(checkField('Different first page', sec.useFirstPageHeaderFooter,
    function (v) { return put({ useFirstPageHeaderFooter: v }); }));
  gSec.appendChild(checks);

  var gSCols = group('Columns');
  box.appendChild(gSCols);
  var wPt = (sec.columns[0] || {}).widthPt;
  var gPt = (sec.columns[0] || {}).paddingEndPt;
  var count = numPlain(sec.columnCount, function (v) {
    var cols = [];
    for (var i = 0; i < v; i++) cols.push({ widthPt: wPt, paddingEndPt: gPt });
    return put({ columns: cols });
  }, { min: 1, max: 3, integer: true, def: DEFAULTS.columnCount });
  gSCols.appendChild(fieldRow('Count (1-3)', count));
  gSCols.appendChild(fieldRow('Column width', numUnit(wPt, function (v) {
    var cols = [];
    for (var i = 0; i < sec.columnCount; i++) cols.push({ widthPt: v, paddingEndPt: gPt });
    return put({ columns: cols });
  }, { min: 1, def: (textWidthPt(sec.marginLeftPt, sec.marginRightPt) -
       (gPt == null ? DEFAULTS.columnGapPt : gPt) * ((sec.columnCount || 1) - 1)) /
       (sec.columnCount || 1) })));
  gSCols.appendChild(fieldRow('Gap after', numUnit(gPt, function (v) {
    var cols = [];
    for (var i = 0; i < sec.columnCount; i++) cols.push({ widthPt: wPt, paddingEndPt: v });
    return put({ columns: cols });
  }, { min: 0, def: DEFAULTS.columnGapPt })));
  return box;
}

/* =================================================================
 * Panel: Sections
 * ================================================================= */
/**
 * The section the cursor is in, and nothing else.
 *
 * Which one that is comes from the cheap cursor probe, the same gate the
 * Lists and Tables panels use; the content read that finds it only happens
 * when the probe's answer changes.
 */
function renderSections() {
  var host = document.getElementById('panel-sections');
  host.innerHTML = '';
  var total = S.data.sectionCount || 0;
  var secs = S.data.sections || [];

  if (!secs.length) {
    host.appendChild(el('p', 'hint',
      'Click inside a section in the document to edit it here.'));
    return;
  }

  // Unlike the lists and tables switches, which also stand in for a cursor
  // that is not in the thing being edited, this one only means "and the
  // others" -- and a lone section has no others.
  if (total > 1) {
    host.appendChild(applyAllSwitch('sections', 'Apply to all sections', 'unifySections',
      { fromStartIndex: secs[0].startIndex }));
  }
  if (S.all.sections) {
    // Every section now carries the same formatting, so the shown one's
    // values are all of their values, and writes fan out to every section.
    host.appendChild(sectionBody(secs[0]));
    return;
  }

  var at = S.data.activeSectionIndex || 0;
  if (total > 1) {
    host.appendChild(el('p', 'hint',
      'Editing the section your cursor is in — section ' + (at + 1) + ' of ' +
      total + '. Click inside a different section to switch.'));
  }
  var row = listItem('Section ' + (at + 1), sectionMeta(secs[0]),
    function () { return sectionBody(secs[0]); }, 'sec:' + at);
  host.appendChild(row);
  if (!row.classList.contains('open')) row.querySelector('.head').click();
}

/**
 * The tab ids this sidebar was handed when it loaded. Passing them with a
 * write lets the server target the right tabs without re-reading the whole
 * document first, which is most of what a write costs on a long document.
 */
function knownTabIds() {
  return ((S.data && S.data.tabs) || []).map(function (t) { return t.tabId; });
}

function applyPage(patch) {
  patch.tabId = S.tabId;
  patch.scope = S.scope;
  patch.tabIds = knownTabIds();
  return call('writePageFormat', [patch]);
}

/* =================================================================
 * Panel: Text styles (the nine named styles)
 * ================================================================= */
function renderStyles() {
  var host = document.getElementById('panel-styles');
  host.innerHTML = '';

  host.appendChild(el('h2', null, 'Built-in styles'));

  S.data.namedStyles.forEach(function (st) {
    var ts = st.textStyle || {};
    var meta = [
      ts.fontFamily || '',
      ts.fontSizePt ? ts.fontSizePt + 'pt' : '',
      ts.bold ? 'bold' : '', ts.italic ? 'italic' : ''
    ].filter(Boolean).join(' · ');
    host.appendChild(listItem(st.label, meta, function () {
      var model = { textStyle: ts, paragraphStyle: st.paragraphStyle || {} };
      var box = el('div');
      box.appendChild(buildStyleEditor(model, function (payload) {
        return call('writeNamedStyle', [{
          tabId: S.tabId, scope: S.scope, tabIds: knownTabIds(),
          namedStyleType: st.namedStyleType,
          textStyle: payload.textStyle,
          paragraphStyle: payload.paragraphStyle
        }]);
      }, { what: st.label }));

      var row = el('div', 'btnrow');
      var save = el('button', 'act', 'Save as style preset');
      save.title = 'Copy this style into your custom styles';
      save.addEventListener('click', function () {
        // Named here, edited in place once the row appears -- nothing pops up.
        var name = uniqueName(st.label + ' copy',
          (S.data.stylePresets || []).map(function (x) { return x.name; }));
        S.open['cstyle:' + name] = true;
        call('saveStylePreset', [{ name: name, textStyle: model.textStyle, paragraphStyle: model.paragraphStyle }])
          .then(reload);
      });
      row.appendChild(save);
      box.appendChild(row);
      return box;
    }));
  });

  renderCustomStyles(host);
}

/* -----------------------------------------------------------------
 * The second style selector: custom styles, applied to the selection.
 *
 * Docs will not accept a tenth entry in its own Styles menu, so this is
 * that list, living in the sidebar instead. Each style is one fold: the
 * heading carries its editable name and the apply and delete buttons, the
 * folded body carries every attribute value.
 * ----------------------------------------------------------------- */

/** "Custom style 1", "Custom style 2", ... -- the first name not taken. */
function uniqueName(base, taken) {
  var used = {};
  (taken || []).forEach(function (n) { used[n] = true; });
  var n = 1;
  while (used[base + ' ' + n]) n++;
  return base + ' ' + n;
}

/** The one-line summary beside a style's name. */
function styleMetaLine(p) {
  var ts = p.textStyle || {};
  return [
    ts.fontFamily || '',
    ts.fontSizePt ? ts.fontSizePt + 'pt' : '',
    ts.bold ? 'bold' : '', ts.italic ? 'italic' : ''
  ].filter(Boolean).join(' · ');
}

function renderCustomStyles(host) {
  host.appendChild(el('h2', null, 'Custom styles'));
  var presets = S.data.stylePresets || [];
  if (!presets.length) {
    host.appendChild(el('p', 'hint', 'No custom styles yet.'));
  }

  presets.forEach(function (p) { host.appendChild(customStyleRow(p)); });

  var addRow = el('div', 'btnrow');
  var add = el('button', 'act', 'New custom style…');
  add.title = 'Create a custom style, starting from Normal text';
  add.addEventListener('click', function () {
    // Named here, edited in place once the row appears -- nothing pops up.
    var name = uniqueName('Custom style', presets.map(function (x) { return x.name; }));
    S.open['cstyle:' + name] = true;
    var base = normalTextStyle();
    call('saveStylePreset', [{ name: name, textStyle: base.textStyle,
                              paragraphStyle: base.paragraphStyle }])
      .then(reload)
      .catch(function (e) { status(String(e.message || e), 'err'); });
  });
  addRow.appendChild(add);
  host.appendChild(addRow);
}

function customStyleRow(p) {
  var item = el('div', 'item');
  var head = el('div', 'head');
  head.appendChild(el('span', 'tw'));

  var nameIn = el('input', 'name');
  nameIn.type = 'text';
  nameIn.value = p.name;
  nameIn.title = 'Rename this custom style';
  var meta = el('span', 'meta', styleMetaLine(p));
  var apply = el('button', 'act iconbtn', '✓');
  apply.title = 'Apply "' + p.name + '" to the current selection';
  var del = el('button', 'act danger iconbtn trash', '\uD83D\uDDD1\uFE0E');
  del.title = 'Delete this custom style';

  // Renames are live: everything downstream reads the box, so applying or
  // saving right after a rename uses the new name without a re-render.
  function currentName() { return nameIn.value.trim() || p.name; }
  bindCommit(nameIn, function (i) {
    var v = i.value.trim();
    if (!v) return { error: 'A style needs a name' };
    if (v !== p.name && (S.data.stylePresets || []).some(function (x) { return x.name === v; })) {
      return { error: 'A style named "' + v + '" already exists' };
    }
    return { value: v };
  }, function (v) {
    return call('renameStylePreset', [{ from: p.name, to: v }]).then(function () {
      S.open['cstyle:' + v] = S.open['cstyle:' + p.name];
      delete S.open['cstyle:' + p.name];
      p.name = v;
      apply.title = 'Apply "' + v + '" to the current selection';
    });
  });

  apply.addEventListener('click', function () {
    call('applyStylePresetToSelection', [{ name: currentName() }])
      .catch(function (e) { status(String(e.message || e), 'err'); });
  });
  del.addEventListener('click', function () {
    call('deleteStylePreset', [{ name: currentName() }])
      .then(reload)
      .catch(function (e) { status(String(e.message || e), 'err'); });
  });

  head.appendChild(nameIn);
  head.appendChild(meta);
  head.appendChild(apply);
  head.appendChild(del);

  var body = el('div', 'body');
  var built = false;
  function expand() {
    if (built) return;
    built = true;
    body.appendChild(fieldRow('Bind to', selectField(
      [{ id: '', label: 'Choose a named style…' }].concat(S.data.constants.namedStyleTypes),
      '', function (v) {
        if (!v) return;
        return call('applyStylePresetToNamedStyle', [{
          name: currentName(), namedStyleType: v, tabId: S.tabId, scope: S.scope
        }]).then(reload);
      })));
    // Every change saves the whole style: a preset is a stored object, not a
    // live part of the document, so there is nothing incremental to write to.
    var model = { textStyle: copy(p.textStyle), paragraphStyle: copy(p.paragraphStyle) };
    body.appendChild(buildStyleEditor(model, function () {
      return call('saveStylePreset', [{
        name: currentName(), textStyle: model.textStyle, paragraphStyle: model.paragraphStyle
      }]).then(function () { meta.textContent = styleMetaLine(model); });
    }, { what: p.name }));
  }

  head.addEventListener('click', function (e) {
    if (e.target === nameIn || e.target === apply || e.target === del) return;
    expand();
    item.classList.toggle('open');
    S.open['cstyle:' + currentName()] = item.classList.contains('open');
  });
  item.appendChild(head);
  item.appendChild(body);
  if (S.open['cstyle:' + p.name]) { expand(); item.classList.add('open'); }
  return item;
}

/**
 * What a brand-new custom style starts out as: a copy of Normal text.
 *
 * Not an empty style. A style with no attributes set applies nothing, so it
 * would look broken the first time it was used; the document's own base style
 * is a starting point the user can recognise and then edit away from.
 */
function normalTextStyle() {
  var list = S.data.namedStyles || [];
  var normal = null;
  list.forEach(function (st) {
    if (!normal && st.namedStyleType === 'NORMAL_TEXT') normal = st;
  });
  normal = normal || list[0] || {};
  return { textStyle: normal.textStyle || {}, paragraphStyle: normal.paragraphStyle || {} };
}

/* =================================================================
 * Panel: Bullet / list styles
 * ================================================================= */
/** A stand-in for each way Docs can number a level, to show one as an example. */
var GLYPH_SAMPLES = {
  DECIMAL: '1', ZERO_DECIMAL: '01',
  UPPER_ALPHA: 'A', ALPHA: 'a',
  UPPER_ROMAN: 'I', ROMAN: 'i'
};

/**
 * What a nesting level's marker looks like -- as the marker, not as the API's
 * description of it.
 *
 * glyphFormat is a template in which %0, %1 ... stand for the numbers of this
 * level and its parents, so filling those in with the level's symbol, or with
 * a sample of its numbering, gives back exactly what the reader sees in the
 * document: "●", or "1.", or "a)".
 */
function glyphExample(lv) {
  var fill = lv.glyphSymbol || GLYPH_SAMPLES[lv.glyphType] || '';
  if (!fill) return '';
  return (lv.glyphFormat || '%0').replace(/%\d/g, fill);
}

/** What a list is called in the panel, and the one-line summary beside it. */
function listName(list, ordinal) {
  return (list.kind === 'numbered' ? 'Numbered list ' : 'Bulleted list ') + ordinal;
}

function listMeta(list) {
  var marker = glyphExample((list.levels || [])[0] || {});
  return (marker ? marker + ' \u00b7 ' : '') +
    list.itemCount + (list.itemCount === 1 ? ' item' : ' items') +
    (list.preview ? ' \u00b7 ' + list.preview : '');
}

/** Where a write goes: one list, or every list in the tab. */
function listTarget(list) {
  return list ? { tabId: S.tabId, listId: list.listId }
              : { tabId: S.tabId, allLists: true };
}

function renderLists() {
  var host = document.getElementById('panel-lists');
  host.innerHTML = '';

  var lists = S.data.lists.lists;
  if (!lists.length) {
    host.appendChild(el('p', 'hint',
      'Click inside a list in the document to edit it here.'));
    return;
  }
  host.appendChild(applyAllSwitch('lists', 'Apply to all lists', 'unifyLists'));
  if (S.all.lists) {
    // Every list now carries the same formatting, so the first one's values
    // are all of their values; the editor shows them and writes to them all.
    host.appendChild(listBody(null));
    return;
  }

  var active = null;
  lists.forEach(function (l) { if (l.listId === S.data.lists.activeListId) active = l; });
  if (active) {
    host.appendChild(el('p', 'hint',
      'Editing the list your cursor is in. Click inside a different list to switch.'));
    var row = listItem(listName(active, lists.indexOf(active) + 1), listMeta(active),
      function () { return listBody(active); }, 'list:' + active.listId);
    host.appendChild(row);
    if (!row.classList.contains('open')) row.querySelector('.head').click();
    return;
  }

  host.appendChild(el('p', 'hint',
    'Click inside a list in the document to edit it here.'));
}

/**
 * Pick a list's marker by the character it is, not by the name of an enum.
 *
 * These fifteen are every marker the API can produce, because the only way to
 * put one on a paragraph is createParagraphBullets and it takes one of fifteen
 * fixed presets. No request writes a glyph symbol, so any other character --
 * a dingbat, an arrow, an emoji -- can only be set in Docs itself, under
 * Format > Bullets & numbering > List options > More bullets. Whatever is set
 * that way is read back and shown here like any other marker.
 */
function markerPicker(list) {
  var box = el('div');
  var presets = S.data.constants.bulletPresets || [];
  var current = list ? glyphExample((list.levels || [])[0] || {}) : '';

  [['Bullets', false], ['Numbering', true]].forEach(function (g) {
    var mine = presets.filter(function (p) { return !!p.numbered === g[1]; });
    if (!mine.length) return;
    box.appendChild(el('h2', null, g[0]));
    var row = el('div', 'glyphs');
    mine.forEach(function (p) {
      var b = el('button', p.numbered ? 'glyph num' : 'glyph', p.glyphs[0]);
      b.title = 'Levels 1-3:  ' + p.glyphs.join('   ');
      if (current && p.glyphs[0] === current) b.classList.add('on');
      b.addEventListener('click', function () {
        var t = listTarget(list);
        t.bulletPreset = p.id;
        return call('applyBulletPreset', [t]).then(reload);
      });
      row.appendChild(b);
    });
    box.appendChild(row);
  });
  return box;
}

/**
 * `list` of null edits every list in the tab at once.
 *
 * The nesting levels are the view: a list is a stack of levels, and almost
 * everything you would want to change -- indent, spacing, the text style of
 * the items -- belongs to one level rather than to the list.
 *
 * The one thing that does not is the marker. createParagraphBullets takes a
 * preset that fixes the glyph for all three levels together, and no request
 * in the API edits a level's glyph, so the marker style is chosen once for
 * the whole list and each level shows what that choice gives it. Taking a
 * marker off is different: that works on paragraphs, so a level can drop its
 * markers on its own.
 */
function listBody(list) {
  var box = el('div');
  box.appendChild(el('h2', null, 'Marker style'));
  box.appendChild(el('p', 'hint',
    'Markers belong to the whole list, not to one level. A style names three ' +
    'markers, one for each of the first three levels, and levels below that ' +
    'reuse them in the same order. A single level can still have its markers ' +
    'taken off.'));
  box.appendChild(markerPicker(list));

  var levels = (list || S.data.lists.lists[0]).levels;
  var key = list ? list.listId : 'all';
  levels.forEach(function (lv) {
    if (!lv.inUse && lv.level > 2) return;   // Docs always defines 9; show the useful ones
    var glyph = list ? (glyphExample(lv) || 'no marker') : 'level ' + (lv.level + 1);
    var row = listItem(
      'Level ' + (lv.level + 1) + (lv.inUse ? '' : ' (unused)'),
      glyph + (lv.indentStartPt != null ? ' \u00b7 indent ' + fromPt(lv.indentStartPt, S.unit) + S.unit.toLowerCase() : ''),
      function () {
        var inner = el('div');
        inner.appendChild(levelMarker(list, lv));
        var cur = lv.style || { textStyle: {}, paragraphStyle: {}, mixed: [] };
        var model = { textStyle: copy(cur.textStyle), paragraphStyle: copy(cur.paragraphStyle) };
        inner.appendChild(buildStyleEditor(model, function (payload) {
          var t = listTarget(list);
          t.level = lv.level;
          t.textStyle = payload.textStyle;
          t.paragraphStyle = payload.paragraphStyle;
          return call('writeListLevelStyle', [t]);
        }, { mixed: cur.mixed, what: 'Level ' + (lv.level + 1) }));
        return inner;
      },
      'lvl:' + key + ':' + lv.level);
    // A level's depth is the point of the panel, so the heading is set in by
    // its own depth: one ex per level, with level 1 flush at the margin.
    var name = row.querySelector('.name');
    if (name) name.style.marginLeft = lv.level + 'ex';
    box.appendChild(row);
  });
  return box;
}

/**
 * What this one level's marker is, and the one thing that can be done to it
 * on its own: taken away. \u2298 rather than a word, so it sits beside the
 * glyphs in the picker above as one more thing a marker can be.
 */
function levelMarker(list, lv) {
  var wrap = el('div', 'glyphs');
  var cur = list ? glyphExample(lv) : '';
  if (cur) {
    var shown = el('button', 'glyph on');
    shown.textContent = cur;
    shown.disabled = true;
    shown.title = 'The marker this level gets from the list\u2019s marker style';
    wrap.appendChild(shown);
  }
  var none = el('button', 'glyph none', '\u2298');
  none.title = 'No marker on this level';
  if (!cur) none.classList.add('on');
  none.addEventListener('click', function () {
    var t = listTarget(list);
    t.level = lv.level;
    return call('removeBullets', [t]).then(reload);
  });
  wrap.appendChild(none);
  return wrap;
}
</script>
<script>
/* =================================================================
 * Panel: Footnotes
 * ================================================================= */
function renderNotes() {
  var host = document.getElementById('panel-notes');
  host.innerHTML = '';

  host.appendChild(el('h2', null, 'Style all footnote text'));
  host.appendChild(segmentEditor('footnotes', 'Footnote text', {
    caveat: 'Google Docs has no footnote style, so this writes the change into ' +
      'every footnote in the tab. New footnotes come out unstyled.'
  }));

  host.appendChild(el('h2', null, 'Footnote callout marks'));
  host.appendChild(segmentEditor('footnoteRefs', 'Footnote callouts', {
    paragraph: false,
    caveat: 'The small number in the body text, not the note itself.'
  }));

  host.appendChild(el('h2', null, 'Convert footnotes to endnotes'));
  var headingIn = el('input');
  headingIn.type = 'text';
  headingIn.value = 'Notes';
  host.appendChild(fieldRow('Section heading', headingIn));

  var row = el('div', 'btnrow');
  var copyBtn = el('button', 'act', 'Append copy (keep footnotes)');
  copyBtn.addEventListener('click', function () { runConvert('copy', headingIn.value); });
  var convBtn = el('button', 'act danger', 'Convert (delete footnotes)');
  convBtn.addEventListener('click', function () {
    runConvert('convert', headingIn.value);
  });
  row.appendChild(copyBtn);
  row.appendChild(convBtn);
  host.appendChild(row);
}

function runConvert(mode, heading) {
  status('Converting…', '');
  call('convertFootnotesToEndnotes', [{ tabId: S.tabId, mode: mode, heading: heading }])
    .then(function () { status('', ''); return reload(); })
    .catch(function (e) { status(String(e.message || e), 'err'); });
}

function segmentEditor(target, label, opts) {
  opts = opts || {};
  var cur = currentSegmentStyle(target);
  var model = { textStyle: copy(cur.textStyle), paragraphStyle: copy(cur.paragraphStyle) };
  return buildStyleEditor(model, function (payload) {
    return call('writeSegmentStyle', [{
      tabId: S.tabId, scope: S.scope, target: target,
      textStyle: payload.textStyle, paragraphStyle: payload.paragraphStyle
    }]);
  }, { noPageBreak: true, mixed: cur.mixed, what: label, caveat: opts.caveat,
       paragraph: opts.paragraph, character: opts.character });
}

/** Current values behind each of the "style them all at once" editors. */
function currentSegmentStyle(target) {
  var seg = S.data.segments || {};
  var src = target === 'footnotes' ? seg.allFootnotesStyle
          : target === 'headers' ? seg.allHeadersStyle
          : target === 'footers' ? seg.allFootersStyle
          : target === 'footnoteRefs' ? seg.footnoteRefStyle
          : null;
  return {
    textStyle: (src && src.textStyle) || {},
    paragraphStyle: (src && src.paragraphStyle) || {},
    mixed: (src && src.mixed) || []
  };
}

</script>
<script>
/* =================================================================
 * Panel: Headers and footers
 * ================================================================= */

/**
 * Which headers and footers a change goes to.
 *
 * Docs keeps up to three headers and three footers per section -- the
 * default one, the first-page one and the even-page one -- and a script
 * cannot ask which of them the cursor is in: DocumentApp models a document
 * as having at most one header section, so the probe can say the cursor is
 * in a header but not in which header. So the set is chosen here rather
 * than guessed.
 *
 * The two axes are the section and the side of the spread, and they get a
 * menu each: crossing them into one menu made every entry long enough that
 * the closed control could not show which was chosen. A section names its
 * own headers and footers, or inherits them, so "this section" is the one
 * the cursor is in -- found from the body paragraph the cursor sits in,
 * exactly as the sections panel finds it, which is why styling a section's
 * header does not need the cursor to be inside the header. R pages are the
 * right-hand ones, covered by the default and first-page segments; L pages
 * are the left-hand ones, covered by the even-page segments.
 *
 * The choice is still carried as one value, "<sections>:<pages>", because
 * that is what names a set of segments.
 */
var HF_SECTION_SCOPES = [
  { id: 'sec', label: 'This section' },
  { id: 'all', label: 'All sections' }
];

var HF_PAGE_SCOPES = [
  { id: 'left',  label: 'L pages only' },
  { id: 'right', label: 'R pages only' },
  { id: 'both',  label: 'L+R pages' }
];

/** Part 0 is the sections axis, part 1 the pages one. */
function hfScopePart(i) {
  return String(S.hfScope).split(':')[i];
}

function setHfScope(sections, pages) {
  S.hfScope = sections + ':' + pages;
  renderAll();
}

/**
 * The segments the current choice names.
 *
 * A document with one section -- which is most of them -- has nothing to
 * narrow, so "this section" and "all sections" name the same set and the
 * cursor does not come into it at all.
 */
function hfSegments() {
  var segs = S.data.segments;
  var parts = String(S.hfScope).split(':');
  var pool = segs.headers.concat(segs.footers);
  if (parts[0] === 'sec' && (S.data.sectionCount || 0) > 1) {
    var at = S.data.activeSectionIndex || 0;
    pool = pool.filter(function (s) { return (s.sections || []).indexOf(at) !== -1; });
  }
  return pool.filter(function (s) { return parts[1] === 'both' || s.parity === parts[1]; });
}

/**
 * The other sections that share the segments about to be styled.
 *
 * An unset header id inherits from the section before it, so one segment
 * commonly serves a run of sections. Writing to it writes to all of them,
 * and the panel says which before it does.
 */
function hfAlsoUsedBy(segs) {
  var at = S.data.activeSectionIndex || 0;
  var others = {};
  segs.forEach(function (s) {
    (s.sections || []).forEach(function (i) { if (i !== at) others[i] = true; });
  });
  return Object.keys(others).map(Number).sort(function (a, b) { return a - b; });
}

/** [0, 2, 3] as the sections a reader counts them: "1, 3 and 4". */
function humanSections(indices) {
  var n = indices.map(function (i) { return i + 1; });
  if (n.length === 1) return String(n[0]);
  return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}

/** "2 headers and 1 footer", so the editor's heading says what it will write to. */
function hfDescription(segs) {
  var h = 0, f = 0;
  segs.forEach(function (s) { if (s.kind === 'header') h++; else f++; });
  var bits = [];
  if (h) bits.push(h + (h === 1 ? ' header' : ' headers'));
  if (f) bits.push(f + (f === 1 ? ' footer' : ' footers'));
  return bits.join(' and ');
}

/**
 * One set of values for a set of segments, agreeing where they agree.
 *
 * Each segment arrives already summarised: a value per field, plus the names
 * of the fields its own paragraphs disagree about. Rolling several of those
 * together is the same rule one level up -- a field survives only if every
 * segment reports it and every segment reports the same thing. Empty
 * segments are left out, because there is no text in them to have a style.
 */
function combineSegmentStyles(segs) {
  var out = { textStyle: {}, paragraphStyle: {}, mixed: [] };
  var live = segs.filter(function (s) { return !s.empty && s.style; });
  if (!live.length) return out;
  var mixed = {};
  live.forEach(function (s) {
    (s.style.mixed || []).forEach(function (k) { mixed[k] = true; });
  });
  ['textStyle', 'paragraphStyle'].forEach(function (half) {
    var keys = {};
    live.forEach(function (s) {
      Object.keys(s.style[half] || {}).forEach(function (k) { keys[k] = true; });
    });
    Object.keys(keys).forEach(function (k) {
      var head = JSON.stringify(live[0].style[half][k]);
      var agreed = head !== undefined && live.every(function (s) {
        return JSON.stringify((s.style[half] || {})[k]) === head;
      });
      if (agreed) out[half][k] = JSON.parse(head);
      else mixed[k] = true;
    });
  });
  out.mixed = Object.keys(mixed).sort();
  return out;
}

/**
 * Whether this section keeps its own header and footer, and the two buttons
 * that change that. Docs calls it "link to previous".
 *
 * The two kinds are independent -- a section can have its own header while
 * its footer still continues the section before it -- so they get a row
 * each. Within one kind the default, first-page and even-page variants move
 * together: handing the header back gives up all three, and breaking away
 * gets the default one, which is the only kind the Docs API can create.
 */
/** "Margins" alone in a one-section tab, and where they land in any other. */
function hfSectionSuffix(heading, manySections) {
  if (!manySections) return heading;
  return heading + (hfScopePart(0) === 'all' ? ', in every section' : ', in this section');
}

/**
 * A header or footer margin, from the section the panel is showing.
 *
 * A section that sets neither is positioned by the document's, so that is
 * what the field shows until the section has one of its own.
 */
function hfMargin(key) {
  var sec = S.data.section;
  if (sec && sec[key] !== null && sec[key] !== undefined) return sec[key];
  return S.data.pageFormat[key];
}

function applyHfMargin(patch) {
  var sec = S.data.section;
  // Before the first poll answers there is no section to write to, and the
  // document's margin is the one in force anyway.
  if (!sec) return applyPage(patch);
  patch.tabId = S.tabId;
  patch.startIndex = sec.startIndex;
  patch.applyAll = hfScopePart(0) === 'all';
  return call('writeSection', [patch]);
}

function hfLinkBox() {
  var links = S.data.hfLinks || [];
  var L = S.data.hfLink;
  if (!L) return null;
  var all = hfScopePart(0) === 'all' && links.length > 1;
  var box = el('div', 'linkbox');

  ['header', 'footer'].forEach(function (kind) {
    var row = el('div', 'btnrow');
    var say = el('span', 'linkstate');
    var buttons = [];

    if (all) {
      // Both directions are on offer at once here: "all sections" is a state
      // to put the tab into, not a switch on what any one section happens to
      // be doing now.
      var own = links.filter(function (x) {
        return !x.isFirst && (kind === 'header' ? x.ownHeader : x.ownFooter);
      }).length;
      say.textContent = own
        ? own + ' of ' + (links.length - 1) + ' later sections have their own ' + kind + '.'
        : 'Every section shares one ' + kind + '.';
      var give = el('button', 'act', 'Give each its own ' + kind);
      give.addEventListener('click', function () { setLink(kind, 'own', true); });
      buttons.push(give);
      if (own) {
        var share = el('button', 'act danger', 'Share one ' + kind + ' (deletes the rest)');
        share.addEventListener('click', function () { setLink(kind, 'previous', true); });
        buttons.push(share);
      }
    } else {
      var has = kind === 'header' ? L.hasHeader : L.hasFooter;
      var mine = kind === 'header' ? L.ownHeader : L.ownFooter;
      var here = L.sectionIndex + 1;
      if (!has) {
        say.textContent = 'No ' + kind + ' yet.';
        var add = el('button', 'act', 'Add a ' + kind);
        add.addEventListener('click', function () { setLink(kind, 'own', false); });
        buttons.push(add);
      } else if (L.isFirst) {
        // Nothing to offer: the first section's is the document's, and it has
        // no section before it to hand it back to.
        return;
      } else if (mine) {
        say.textContent = 'Section ' + here + ' has its own ' + kind + '.';
        var back = el('button', 'act danger',
          'Continue from section ' + (here - 1) + ' (deletes this one)');
        back.addEventListener('click', function () { setLink(kind, 'previous', false); });
        buttons.push(back);
      } else {
        say.textContent = 'Section ' + here + ' continues the ' + kind + ' before it.';
        var own1 = el('button', 'act', 'Give it its own ' + kind);
        own1.addEventListener('click', function () { setLink(kind, 'own', false); });
        buttons.push(own1);
      }
    }

    row.appendChild(say);
    buttons.forEach(function (b) { row.appendChild(b); });
    box.appendChild(row);
  });
  return box;
}

function setLink(kind, link, applyAll) {
  status(link === 'own' ? 'Adding…' : 'Removing…', '');
  call('setSegmentLink', [{
    tabId: S.tabId, kind: kind, link: link, applyAll: !!applyAll,
    sectionIndex: (S.data.hfLink || {}).sectionIndex
  }]).then(function () { status('', ''); return reload(); })
    .catch(function (e) { status(String(e.message || e), 'err'); });
}

function renderHeaders() {
  var host = document.getElementById('panel-hf');
  host.innerHTML = '';
  var pf = S.data.pageFormat;

  var total = S.data.sectionCount || 0;
  var at = S.data.activeSectionIndex || 0;
  var manySections = total > 1;

  host.appendChild(el('h2', null, 'Style headers and footers'));
  // One section means there is no choice of sections to make, so that menu
  // is left out and hfSegments ignores which half of it is set.
  var menus = [];
  if (manySections) {
    menus.push(selectField(HF_SECTION_SCOPES, hfScopePart(0), function (v) {
      setHfScope(v, hfScopePart(1));
    }));
  }
  menus.push(selectField(HF_PAGE_SCOPES, hfScopePart(1), function (v) {
    setHfScope(hfScopePart(0), v);
  }));
  var scope = fieldRow('Apply to', menus);
  // Two menus sharing the row leaves neither wide enough to show its choice
  // unless the label gives up most of its column.
  if (menus.length > 1) scope.className = 'field tightlabel';
  host.appendChild(scope);
  // Only the even-page switch is document-wide; the first-page one belongs to
  // a section, and lives on the Sections tab where a section can be picked.
  var checks = el('div', 'checks');
  checks.appendChild(checkField('Different L/R pages', pf.useEvenPageHeaderFooter,
    function (v) { return applyPage({ useEvenPageHeaderFooter: v }); }));
  host.appendChild(checks);
  host.appendChild(el('p', 'hint',
    '“Different first page” is set one section at a time, on the Sections tab.'));

  var perSection = hfScopePart(0) === 'sec' && manySections;
  if (manySections) {
    host.appendChild(el('p', 'hint',
      'Section ' + (at + 1) + ' of ' + total + ', where your cursor is' +
      ((S.ctx || {}).segmentKind === 'header' || (S.ctx || {}).segmentKind === 'footer'
        ? ' — or was, before you clicked into a header. Click in the body to switch.'
        : '.')));
  }

  var link = hfLinkBox();
  if (link && link.childNodes.length) {
    host.appendChild(el('h2', null, hfSectionSuffix(
      'Own header and footer', manySections)));
    host.appendChild(link);
  }

  var segs = hfSegments();
  if (!segs.length) {
    host.appendChild(el('p', 'hint',
      'Nothing in this tab matches that choice. Headers and footers are added in ' +
      'the document itself, under Insert > Headers & footers.'));
  } else {
    if (perSection) {
      var shared = hfAlsoUsedBy(segs);
      if (shared.length) {
        var w = el('div', 'note');
        w.textContent = 'Shared with ' +
          (shared.length === 1 ? 'section ' : 'sections ') + humanSections(shared) +
          ', which this will change too.';
        host.appendChild(w);
      }
    }
    var cur = combineSegmentStyles(segs);
