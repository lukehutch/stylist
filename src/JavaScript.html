<script>
/* =================================================================
 * State
 * ================================================================= */
var S = {
  data: null,          // last full loadAll payload
  unit: 'IN',          // display unit for dimension fields
  scope: 'all',        // every write covers all tabs; not user-selectable
  tabId: null,
  unitFields: [],      // dimension inputs to re-render when the unit changes
  open: {},            // which list items are expanded, so a re-render can restore them
  fingerprint: null,   // JSON of the last payload, to spot document-side changes
  busy: 0              // server calls in flight; polling stands aside while any are
};

var UNIT_TO_PT = { PT: 1, IN: 72, CM: 72 / 2.54, MM: 72 / 25.4 };
function toPt(v, u) { return Number(v) * UNIT_TO_PT[u]; }
/**
 * Points -> display value in unit `u`.
 *
 * Points and millimetres are fine-grained enough that a tenth is the useful
 * resolution. Inches and centimetres are not: three decimals there, except
 * that a value sitting within 0.0005 of a tenth or an eighth snaps to it, so
 * a half-inch margin reads 0.5 and not 0.499 or 0.5001.
 */
var SNAP_GRIDS = [0.1, 0.125];
var SNAP_TOL = 0.0005;

function fromPt(v, u) {
  if (v === null || v === undefined) return '';
  var raw = Number(v) / UNIT_TO_PT[u];
  if (!isFinite(raw)) return '';
  if (u === 'PT' || u === 'MM') return Math.round(raw * 10) / 10;
  for (var i = 0; i < SNAP_GRIDS.length; i++) {
    var g = SNAP_GRIDS[i];
    var snapped = Math.round(raw / g) * g;
    if (Math.abs(raw - snapped) <= SNAP_TOL) return Math.round(snapped * 1000) / 1000;
  }
  return Math.round(raw * 1000) / 1000;
}

/* =================================================================
 * Server bridge
 *
 * google.script.run calls are serialised: live apply fires on every field
 * blur, and overlapping batchUpdate calls against one document race in
 * ways that are painful to debug. One in flight at a time.
 * ================================================================= */
var chain = Promise.resolve();

function rawCall(fn, args) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fn].apply(null, args || []);
  });
}

function call(fn, args) {
  S.busy++;
  var p = chain.catch(function () {}).then(function () { return rawCall(fn, args); });
  chain = p.catch(function () {});
  p.then(done, done);
  function done() { S.busy--; }
  return p;
}

/**
 * The bar along the bottom of the sidebar, which is there only when it has
 * something to say -- and only ever says two kinds of thing.
 *
 * Errors, because a write that did not happen leaves nothing to look at. And
 * "working on it" for the two operations slow enough to look frozen, each of
 * which clears the bar itself when it finishes.
 *
 * Nothing else. Every field applies to the document as you leave it and the
 * poll brings changes back the other way, so a line reporting that something
 * worked is one more thing to read about a result already on screen. Calling
 * this with no message hides the bar.
 */
function status(msg, kind) {
  var el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = kind || '';
  el.style.display = msg ? 'block' : 'none';
}

/* =================================================================
 * DOM helpers
 * ================================================================= */
/** A detached copy, so an editor's working model never mutates S.data. */
function copy(o) { return JSON.parse(JSON.stringify(o || {})); }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}

function fieldRow(labelText, control) {
  var row = el('div', 'field');
  row.appendChild(el('label', null, labelText));
  var ctl = el('div', 'ctl');
  (Array.isArray(control) ? control : [control]).forEach(function (c) { ctl.appendChild(c); });
  row.appendChild(ctl);
  return row;
}

/**
 * Live apply.
 *
 * `change` covers blur and Enter for text/number inputs and immediate
 * selection for selects and checkboxes; the extra keydown handler makes
 * Enter commit without waiting for focus to move. Tab commits via blur.
 * A field that fails validation is marked and never sent.
 */
/** What is actually in a field: a checkbox says checked, everything else value. */
function shownValue(input) {
  return input.type === 'checkbox' ? input.checked : input.value;
}

function bindCommit(input, validate, commit) {
  var lastSent;
  function attempt() {
    // Re-rendering removes this element from the page, and a browser may fire
    // change on the way out. Committing then would write a half-typed value
    // the user never confirmed.
    if (rerendering) return;
    var v = validate(input);
    if (v.error) {
      input.classList.add('invalid');
      input.title = v.error;
      status(v.error, 'err');
      return;
    }
    input.classList.remove('invalid');
    input.title = '';
    if (v.skip) return;
    var key = JSON.stringify(v.value);
    if (key === lastSent) { input.__live = shownValue(input); return; }  // nothing changed
    lastSent = key;
    // What was on screen when the write went out. Reading it back when the
    // write resolves would call the field clean against text typed since.
    var sent = shownValue(input);
    input.classList.add('saving');
    Promise.resolve(commit(v.value))
      .then(function () {
        input.classList.remove('saving');
        input.__live = sent;   // the document says this now
      })
      .catch(function (e) {
        input.classList.remove('saving');
        lastSent = undefined;
        status(String((e && e.message) || e), 'err');
      });
  }
  input.addEventListener('change', attempt);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); attempt(); input.blur(); }
  });
  /**
   * Dirty means what is in the box differs from what the document last said --
   * compared, not remembered. A flag set on the first keystroke would still
   * call a field dirty after you typed a digit and deleted it again, and the
   * poll would then leave a field alone that has nothing in it worth keeping.
   */
  input.isDirty = function () { return shownValue(input) !== input.__live; };
  input.setLive = function (val) {
    lastSent = JSON.stringify(val);
    input.__live = shownValue(input);
  };
  return input;
}

/* ---- field constructors ---------------------------------------- */

/** Dimension field: displayed in the current unit, committed in points. */
function numUnit(valuePt, commitPt, opts) {
  opts = opts || {};
  var input = el('input');
  input.type = 'text';
  input.value = fromPt(valuePt, S.unit);
  // An empty dimension box means the value comes from somewhere else -- the
  // named style, the document default -- so say so rather than looking unset.
  input.placeholder = opts.placeholder || 'inherited';
  input._pt = valuePt;
  var unitTag = el('span', 'unit', S.unit.toLowerCase());

  bindCommit(input, function (i) {
    var raw = i.value.trim();
    if (raw === '') return { skip: true };
    var n = Number(raw);
    if (!isFinite(n)) return { error: '"' + raw + '" is not a number' };
    if (opts.min !== undefined && n < opts.min) return { error: 'Must be at least ' + opts.min };
    return { value: toPt(n, S.unit) };
  }, function (pt) {
    input._pt = pt;
    return commitPt(pt);
  });
  input.setLive(valuePt);

  S.unitFields.push({ input: input, tag: unitTag });
  return [input, unitTag];
}

/** Plain point field, for sizes Docs itself always states in points. */
function numPt(value, commit, opts) {
  opts = opts || {};
  var input = el('input');
  input.type = 'text';
  input.value = (value === null || value === undefined) ? '' : value;
  input.placeholder = opts.placeholder || 'inherited';
  var tag = el('span', 'unit', 'pt');
  bindCommit(input, function (i) {
    var raw = i.value.trim();
    if (raw === '') return { skip: true };
    var n = Number(raw);
    if (!isFinite(n)) return { error: '"' + raw + '" is not a number' };
    if (opts.min !== undefined && n < opts.min) return { error: 'Must be at least ' + opts.min };
    return { value: n };
  }, commit);
  input.setLive(value);
  return [input, tag];
}

/** Unitless number (line spacing multiplier, page number, counts). */
function numPlain(value, commit, opts) {
  opts = opts || {};
  var input = el('input');
  input.type = 'text';
  input.value = (value === null || value === undefined) ? '' : value;
  input.placeholder = opts.placeholder || 'default';
  bindCommit(input, function (i) {
    var raw = i.value.trim();
    if (raw === '') return { skip: true };
    var n = Number(raw);
    if (!isFinite(n)) return { error: '"' + raw + '" is not a number' };
    if (opts.min !== undefined && n < opts.min) return { error: 'Must be at least ' + opts.min };
    if (opts.max !== undefined && n > opts.max) return { error: 'Must be at most ' + opts.max };
    if (opts.integer && Math.round(n) !== n) return { error: 'Must be a whole number' };
    return { value: n };
  }, commit);
  input.setLive(value);
  return input;
}

function selectField(options, value, commit) {
  var sel = el('select');
  options.forEach(function (o) {
    var opt = el('option', null, o.label);
    opt.value = o.id;
    sel.appendChild(opt);
  });
  sel.value = value || '';
  bindCommit(sel, function (i) { return { value: i.value }; }, commit);
  sel.setLive(value || '');
  // Wrapped, because the arrow is drawn by .combo::after painting over the top
  // of the control rather than by the browser painting inside it. Callers only
  // ever hand this straight to fieldRow, so the wrapper is transparent to them.
  var combo = el('span', 'combo');
  combo.appendChild(sel);
  return combo;
}

function checkField(labelText, value, commit) {
  var wrap = el('label');
  var box = el('input');
  box.type = 'checkbox';
  box.checked = !!value;
  bindCommit(box, function (i) { return { value: i.checked }; }, commit);
  box.setLive(!!value);
  wrap.appendChild(box);
  wrap.appendChild(document.createTextNode(labelText));
  return wrap;
}

/**
 * Colour field. The Docs API models "no colour" as an empty OptionalColor,
 * which is distinct from black, so a clear button is a real control here.
 */
function colorField(hex, commit) {
  var input = el('input');
  input.type = 'color';
  input.value = hex || '#000000';
  bindCommit(input, function (i) { return { value: i.value }; }, commit);
  input.setLive(hex || '#000000');

  var clear = el('button', 'act', 'none');
  clear.title = 'Clear the colour (transparent / inherited)';
  clear.addEventListener('click', function () {
    input.setLive(null);
    Promise.resolve(commit(''));
  });
  return [input, clear];
}

<script>
/* =================================================================
 * Enumerations mirrored from the Docs API
 * ================================================================= */
/**
 * The blank first option on a style select.
 *
 * It is both a display and a control. Shown, it means the value is not set
 * here and comes from the named style or the document default. Chosen, it
 * resets the property: the write names the field in its mask but sends no
 * value, which is how the Docs API asks for the inherited value back.
 */
var INHERIT = { id: '', label: 'Inherited' };

var ALIGNMENTS = [
  { id: 'START', label: 'Left / start' }, { id: 'CENTER', label: 'Centre' },
  { id: 'END', label: 'Right / end' }, { id: 'JUSTIFIED', label: 'Justified' }
];
var BASELINES = [
  { id: 'NONE', label: 'Normal' }, { id: 'SUPERSCRIPT', label: 'Superscript' },
  { id: 'SUBSCRIPT', label: 'Subscript' }
];
var DIRECTIONS = [
  { id: 'LEFT_TO_RIGHT', label: 'Left to right' }, { id: 'RIGHT_TO_LEFT', label: 'Right to left' }
];
var SPACING_MODES = [
  { id: 'COLLAPSE_LISTS', label: 'Collapse space in lists' },
  { id: 'NEVER_COLLAPSE', label: 'Never collapse space' }
];
var DASH_STYLES = [
  { id: 'SOLID', label: 'Solid' }, { id: 'DOT', label: 'Dotted' }, { id: 'DASH', label: 'Dashed' }
];
var CONTENT_ALIGNMENTS = [
  { id: 'TOP', label: 'Top' }, { id: 'MIDDLE', label: 'Middle' }, { id: 'BOTTOM', label: 'Bottom' }
];
var WEIGHTS = [100, 200, 300, 400, 500, 600, 700, 800, 900].map(function (w) {
  return { id: String(w), label: String(w) + (w === 400 ? ' (normal)' : w === 700 ? ' (bold)' : '') };
});
var BORDER_SIDES = [
  { key: 'borderTop', label: 'Top' }, { key: 'borderBottom', label: 'Bottom' },
  { key: 'borderLeft', label: 'Left' }, { key: 'borderRight', label: 'Right' },
  { key: 'borderBetween', label: 'Between' }
];

/* =================================================================
 * Style editor: every character and paragraph attribute the API exposes
 *
 * `model` is mutated in place. `commit` receives either the whole model
 * (opts.sparse false -- used for named styles, where re-asserting every
 * value avoids any ambiguity in the field mask) or only the fields the
 * user has actually touched (opts.sparse true -- used when styling
 * existing content, where stomping untouched attributes would be wrong).
 * ================================================================= */
var FIELD_LABELS = {
  fontFamily: 'font', fontWeight: 'weight', fontSizePt: 'size',
  bold: 'bold', italic: 'italic', underline: 'underline',
  strikethrough: 'strikethrough', smallCaps: 'small caps',
  baselineOffset: 'super/subscript', foregroundColor: 'text colour',
  backgroundColor: 'highlight', alignment: 'alignment', direction: 'direction',
  spacingMode: 'spacing mode', lineSpacing: 'line spacing',
  spaceAbovePt: 'space above', spaceBelowPt: 'space below',
  indentStartPt: 'indent start', indentEndPt: 'indent end',
  indentFirstLinePt: 'first-line indent', shadingColor: 'shading',
  keepLinesTogether: 'keep lines together', keepWithNext: 'keep with next',
  avoidWidowAndOrphan: 'widow/orphan control', pageBreakBefore: 'page break before',
  borderTop: 'top border', borderBottom: 'bottom border', borderLeft: 'left border',
  borderRight: 'right border', borderBetween: 'border between',
  contentAlignment: 'cell alignment', paddingTopPt: 'padding top',
  paddingBottomPt: 'padding bottom', paddingLeftPt: 'padding left',
  paddingRightPt: 'padding right', tabStops: 'tab stops'
};
function fieldLabel(key) { return FIELD_LABELS[key] || key; }

function buildStyleEditor(model, commit, opts) {
  opts = opts || {};
  model.textStyle = model.textStyle || {};
  model.paragraphStyle = model.paragraphStyle || {};
  var touchedT = {}, touchedP = {};
  var root = el('div');

  // The fields below show the document's current values. Where the content
  // this editor covers is not uniform, there is no single current value, so
  // say which fields differ rather than showing one arbitrarily.
  if (opts.mixed && opts.mixed.length) {
    var m = el('p', 'hint');
    m.textContent = 'Differs across this content: ' + opts.mixed.map(fieldLabel).join(', ') +
      '. Those fields are shown blank; setting one applies it everywhere here.';
    root.appendChild(m);
  }

  function fire() {
    var payload;
    if (opts.sparse) {
      payload = { textStyle: {}, paragraphStyle: {} };
      Object.keys(touchedT).forEach(function (k) { payload.textStyle[k] = model.textStyle[k]; });
      Object.keys(touchedP).forEach(function (k) { payload.paragraphStyle[k] = model.paragraphStyle[k]; });
      // The API models family and weight as one message, so send both.
      if (payload.textStyle.fontFamily !== undefined) {
        payload.textStyle.fontWeight = model.textStyle.fontWeight || 400;
      }
    } else {
      payload = { textStyle: model.textStyle, paragraphStyle: model.paragraphStyle };
    }
    return commit(payload);
  }
  function setT(k, v) { model.textStyle[k] = v; touchedT[k] = 1; return fire(); }
  function setP(k, v) { model.paragraphStyle[k] = v; touchedP[k] = 1; return fire(); }

  /* ---- character ---- */
  if (opts.character !== false) {
    var gChar = group('Character');
    root.appendChild(gChar);

    var fontInput = el('input');
    fontInput.type = 'text';
    fontInput.setAttribute('list', 'fontlist');
    fontInput.value = model.textStyle.fontFamily || '';
    fontInput.placeholder = 'inherited';
    bindCommit(fontInput, function (i) {
      var v = i.value.trim();
      if (v === '') return { skip: true };
      return { value: v };
    }, function (v) { return setT('fontFamily', v); });
    fontInput.setLive(model.textStyle.fontFamily || '');
    gChar.appendChild(fieldRow('Font', fontInput));

    gChar.appendChild(fieldRow('Weight', selectField(WEIGHTS,
      String(model.textStyle.fontWeight || 400),
      function (v) { return setT('fontWeight', Number(v)); })));

    gChar.appendChild(fieldRow('Size', numPt(model.textStyle.fontSizePt,
      function (v) { return setT('fontSizePt', v); }, { min: 1 })));

    var effects = el('div', 'checks');
    [['bold', 'Bold'], ['italic', 'Italic'], ['underline', 'Underline'],
     ['strikethrough', 'Strikethrough'], ['smallCaps', 'Small caps']].forEach(function (p) {
      effects.appendChild(checkField(p[1], model.textStyle[p[0]], function (v) { return setT(p[0], v); }));
    });
    gChar.appendChild(effects);

    gChar.appendChild(fieldRow('Offset', selectField([INHERIT].concat(BASELINES),
      model.textStyle.baselineOffset || '',
      function (v) { return setT('baselineOffset', v || null); })));

    gChar.appendChild(fieldRow('Text colour', colorField(model.textStyle.foregroundColor,
      function (v) { return setT('foregroundColor', v); })));
    gChar.appendChild(fieldRow('Highlight', colorField(model.textStyle.backgroundColor,
      function (v) { return setT('backgroundColor', v); })));
  }

  /* ---- paragraph ---- */
  if (opts.paragraph !== false) {
    var gPara = group('Paragraph');
    root.appendChild(gPara);

    gPara.appendChild(fieldRow('Alignment', selectField([INHERIT].concat(ALIGNMENTS),
      model.paragraphStyle.alignment || '',
      function (v) { return setP('alignment', v || null); })));

    // Docs stores line spacing as a percentage where normal is 100.
    gPara.appendChild(fieldRow('Line spacing', numPlain(
      model.paragraphStyle.lineSpacing === undefined ? '' : model.paragraphStyle.lineSpacing / 100,
      function (v) { return setP('lineSpacing', v * 100); },
      { min: 0.1, placeholder: 'inherited' })));

    gPara.appendChild(fieldRow('Space above', numUnit(model.paragraphStyle.spaceAbovePt,
      function (v) { return setP('spaceAbovePt', v); }, { min: 0 })));
    gPara.appendChild(fieldRow('Space below', numUnit(model.paragraphStyle.spaceBelowPt,
      function (v) { return setP('spaceBelowPt', v); }, { min: 0 })));

    gPara.appendChild(fieldRow('Spacing mode', selectField([INHERIT].concat(SPACING_MODES),
      model.paragraphStyle.spacingMode || '',
      function (v) { return setP('spacingMode', v || null); })));

    gPara.appendChild(fieldRow('Indent left', numUnit(model.paragraphStyle.indentStartPt,
      function (v) { return setP('indentStartPt', v); })));
    gPara.appendChild(fieldRow('Indent right', numUnit(model.paragraphStyle.indentEndPt,
      function (v) { return setP('indentEndPt', v); })));
    gPara.appendChild(fieldRow('First line', numUnit(model.paragraphStyle.indentFirstLinePt,
      function (v) { return setP('indentFirstLinePt', v); })));

    gPara.appendChild(fieldRow('Direction', selectField([INHERIT].concat(DIRECTIONS),
      model.paragraphStyle.direction || '',
      function (v) { return setP('direction', v || null); })));

    var flow = el('div', 'checks');
    [['keepLinesTogether', 'Keep lines together'], ['keepWithNext', 'Keep with next'],
     ['avoidWidowAndOrphan', 'Avoid widows/orphans'], ['pageBreakBefore', 'Page break before']]
      .forEach(function (p) {
        // The API rejects page_break_before in headers, footers and footnotes.
        if (p[0] === 'pageBreakBefore' && opts.noPageBreak) return;
        flow.appendChild(checkField(p[1], model.paragraphStyle[p[0]], function (v) { return setP(p[0], v); }));
      });
    gPara.appendChild(flow);

    gPara.appendChild(fieldRow('Shading', colorField(model.paragraphStyle.shadingColor,
      function (v) { return setP('shadingColor', v); })));

    /* ---- borders ---- */
    var bItem = el('div', 'item');
    var bHead = el('div', 'head');
    bHead.appendChild(el('span', 'tw'));
    bHead.appendChild(el('span', 'name', 'Paragraph borders'));
    bHead.appendChild(el('span', 'meta', '5 sides'));
    bHead.addEventListener('click', function () { bItem.classList.toggle('open'); });
    var bBody = el('div', 'body');
    BORDER_SIDES.forEach(function (side) {
      var gSide = group(side.label);
      bBody.appendChild(gSide);
      var cur = model.paragraphStyle[side.key] || {};
      function setB(k, v) {
        var b = model.paragraphStyle[side.key] || (model.paragraphStyle[side.key] = {});
        b[k] = v;
        touchedP[side.key] = 1;
        return fire();
      }
      gSide.appendChild(fieldRow('Width', numPt(cur.widthPt,
        function (v) { return setB('widthPt', v); }, { min: 0 })));
      gSide.appendChild(fieldRow('Padding', numPt(cur.paddingPt,
        function (v) { return setB('paddingPt', v); }, { min: 0 })));
      gSide.appendChild(fieldRow('Colour', colorField(cur.color,
        function (v) { return setB('color', v); })));
      gSide.appendChild(fieldRow('Dash', selectField(DASH_STYLES, cur.dashStyle || 'SOLID',
        function (v) { return setB('dashStyle', v); })));
    });
    bItem.appendChild(bHead);
    bItem.appendChild(bBody);
    gPara.appendChild(bItem);
  }

  return root;
}

/**
 * A rounded box for a set of related controls, with its heading sitting in
 * the top edge. That is a fieldset with a legend, so nothing has to fake the
 * gap in the border. Append the controls to what this returns.
 */
function group(title) {
  var g = el('fieldset', 'group');
  g.appendChild(el('legend', null, title));
  return g;
}

/** Collapsible list row used by every panel that shows "a list of things". */
/**
 * Collapsible list row. `key` identifies the row across re-renders -- the
 * background poll rebuilds every panel, and rows that were open stay open.
 */
function listItem(name, meta, buildBody, key) {
  key = key || name;
  var item = el('div', 'item');
  var head = el('div', 'head');
  head.appendChild(el('span', 'tw'));   // turnstile arrow; CSS rotates it when open
  head.appendChild(el('span', 'name', name));
  head.appendChild(el('span', 'meta', meta || ''));
  var body = el('div', 'body');
  var built = false;
  function expand() {
    if (!built) { body.appendChild(buildBody()); built = true; }
  }
  head.addEventListener('click', function () {
    expand();
    item.classList.toggle('open');
    S.open[key] = item.classList.contains('open');
  });
  item.appendChild(head);
  item.appendChild(body);
  if (S.open[key]) { expand(); item.classList.add('open'); }
  return item;
}
</script>
<script>
/* =================================================================
 * Panel: Page setup
 * ================================================================= */
function renderPage() {
  var host = document.getElementById('panel-page');
  host.innerHTML = '';
  var pf = S.data.pageFormat;

  host.appendChild(el('h2', null, 'Page size'));
  var presets = [{ id: '', label: 'Custom…' }].concat(
    S.data.constants.pageSizePresets.map(function (p) { return { id: p.id, label: p.label }; }));
  var match = '';
  S.data.constants.pageSizePresets.forEach(function (p) {
    if (Math.abs((pf.pageWidthPt || 0) - p.widthPt) < 1 && Math.abs((pf.pageHeightPt || 0) - p.heightPt) < 1) match = p.id;
  });
  host.appendChild(fieldRow('Preset', selectField(presets, match, function (v) {
    if (!v) return;
    var p = S.data.constants.pageSizePresets.filter(function (x) { return x.id === v; })[0];
    return applyPage({ pageWidthPt: p.widthPt, pageHeightPt: p.heightPt }).then(reload);
  })));
  host.appendChild(fieldRow('Width', numUnit(pf.pageWidthPt,
    function (v) { return applyPage({ pageWidthPt: v, pageHeightPt: pf.pageHeightPt }); }, { min: 1 })));
  host.appendChild(fieldRow('Height', numUnit(pf.pageHeightPt,
    function (v) { return applyPage({ pageWidthPt: pf.pageWidthPt, pageHeightPt: v }); }, { min: 1 })));

  var orient = el('div', 'checks');
  orient.appendChild(checkField('Landscape (flip dimensions)', pf.flipPageOrientation,
    function (v) { return applyPage({ flipPageOrientation: v }); }));
  host.appendChild(orient);

  host.appendChild(el('h2', null, 'Margins'));
  [['marginTopPt', 'Top'], ['marginBottomPt', 'Bottom'],
   ['marginLeftPt', 'Left'], ['marginRightPt', 'Right']].forEach(function (m) {
    host.appendChild(fieldRow(m[1], numUnit(pf[m[0]], function (v) {
      var p = {}; p[m[0]] = v; return applyPage(p);
    }, { min: 0 })));
  });

  host.appendChild(el('h2', null, 'Header & footer'));
  host.appendChild(fieldRow('Header margin', numUnit(pf.marginHeaderPt,
    function (v) { return applyPage({ marginHeaderPt: v }); }, { min: 0 })));

  hf.appendChild(checkField('Different even pages', pf.useEvenPageHeaderFooter,
    function (v) { return applyPage({ useEvenPageHeaderFooter: v }); }));
  host.appendChild(hf);

  host.appendChild(el('h2', null, 'Document'));
  host.appendChild(fieldRow('Page numbers from', numPlain(pf.pageNumberStart,
    function (v) { return applyPage({ pageNumberStart: v }); }, { min: 0, integer: true })));
  host.appendChild(fieldRow('Mode', selectField(
    [{ id: 'PAGES', label: 'Pages' }, { id: 'PAGELESS', label: 'Pageless' }],
    pf.documentMode, function (v) { return applyPage({ documentMode: v }).then(reload); })));
  host.appendChild(fieldRow('Background', colorField(pf.backgroundColor,
    function (v) { return applyPage({ backgroundColor: v }); })));

  /* ---- sections ---- */
  host.appendChild(el('h2', null, 'Sections'));

      sec.sectionType + ' · ' + sec.columnCount + ' col',

}

function sectionBody(sec) {
  var box = el('div');
  function put(patch) {
    patch.tabId = S.tabId;
    patch.startIndex = sec.startIndex;
    return call('writeSection', [patch]);
  }
  var gSec = group('Margins and layout');
  box.appendChild(gSec);
  [['marginTopPt', 'Top'], ['marginBottomPt', 'Bottom'], ['marginLeftPt', 'Left'],
   ['marginRightPt', 'Right'], ['marginHeaderPt', 'Header'], ['marginFooterPt', 'Footer']]
    .forEach(function (m) {
      gSec.appendChild(fieldRow(m[1], numUnit(sec[m[0]], function (v) {
        var p = {}; p[m[0]] = v; return put(p);
      }, { min: 0 })));
    });
  gSec.appendChild(fieldRow('Direction', selectField(DIRECTIONS, sec.contentDirection,
    function (v) { return put({ contentDirection: v }); })));
  gSec.appendChild(fieldRow('Col separator', selectField(
    [{ id: 'NONE', label: 'None' }, { id: 'BETWEEN_EACH_COLUMN', label: 'Line between columns' }],
    sec.columnSeparatorStyle, function (v) { return put({ columnSeparatorStyle: v }); })));
  gSec.appendChild(fieldRow('Page numbers from', numPlain(sec.pageNumberStart,
    function (v) { return put({ pageNumberStart: v }); }, { min: 0, integer: true })));
  var checks = el('div', 'checks');
  checks.appendChild(checkField('Landscape', sec.flipPageOrientation,
    function (v) { return put({ flipPageOrientation: v }); }));
  checks.appendChild(checkField('Different first page', sec.useFirstPageHeaderFooter,
    function (v) { return put({ useFirstPageHeaderFooter: v }); }));
  gSec.appendChild(checks);

  var gSCols = group('Columns');
  box.appendChild(gSCols);
  var wPt = (sec.columns[0] || {}).widthPt;
  var gPt = (sec.columns[0] || {}).paddingEndPt;
  var count = numPlain(sec.columnCount, function (v) {
    var cols = [];
    for (var i = 0; i < v; i++) cols.push({ widthPt: wPt, paddingEndPt: gPt });
    return put({ columns: cols });
  }, { min: 1, max: 3, integer: true });
  gSCols.appendChild(fieldRow('Count (1-3)', count));
  gSCols.appendChild(fieldRow('Column width', numUnit(wPt, function (v) {
    var cols = [];
    for (var i = 0; i < sec.columnCount; i++) cols.push({ widthPt: v, paddingEndPt: gPt });
    return put({ columns: cols });
  }, { min: 1 })));
  gSCols.appendChild(fieldRow('Gap after', numUnit(gPt, function (v) {
    var cols = [];
    for (var i = 0; i < sec.columnCount; i++) cols.push({ widthPt: wPt, paddingEndPt: v });
    return put({ columns: cols });
  }, { min: 0 })));
  return box;
}

function applyPage(patch) {
  patch.tabId = S.tabId;
  patch.scope = S.scope;
  return call('writePageFormat', [patch]);
}

/* =================================================================
 * Panel: Text styles (the nine named styles)
 * ================================================================= */
function renderStyles() {
  var host = document.getElementById('panel-styles');
  host.innerHTML = '';

  host.appendChild(el('h2', null, 'Built-in styles'));

  S.data.namedStyles.forEach(function (st) {
    var ts = st.textStyle || {};
    var meta = [
      ts.fontFamily || '',
      ts.fontSizePt ? ts.fontSizePt + 'pt' : '',
      ts.bold ? 'bold' : '', ts.italic ? 'italic' : ''
    ].filter(Boolean).join(' · ');
    host.appendChild(listItem(st.label, meta, function () {
      var model = { textStyle: ts, paragraphStyle: st.paragraphStyle || {} };
      var box = el('div');
      box.appendChild(buildStyleEditor(model, function (payload) {
        return call('writeNamedStyle', [{
          tabId: S.tabId, scope: S.scope,
          namedStyleType: st.namedStyleType,
          textStyle: payload.textStyle,
          paragraphStyle: payload.paragraphStyle
        }]);
      }, { sparse: false }));

      var row = el('div', 'btnrow');
      var save = el('button', 'act', 'Save as style preset');
      save.addEventListener('click', function () {
        var name = prompt('Name for this style preset:', st.label + ' copy');
        if (!name) return;
        call('saveStylePreset', [{ name: name, textStyle: model.textStyle, paragraphStyle: model.paragraphStyle }])
          .then(reload);
      });
      row.appendChild(save);
      box.appendChild(row);
      return box;
    }));
  });

  renderCustomStyles(host);
}

/* -----------------------------------------------------------------
 * The second style selector: custom styles, applied to the selection.
 *
 * Docs will not accept a tenth entry in its own Styles menu, so this is
 * that list, living in the sidebar instead.
 * ----------------------------------------------------------------- */
function renderCustomStyles(host) {
  host.appendChild(el('h2', null, 'Custom styles'));
  var note = el('div', 'note');
  note.innerHTML = 'Docs allows exactly nine named styles and no add-on can add a tenth to its ' +
    'Styles menu, so this is a second style list. Select text in the document, then click a ' +
    'style to apply it. A few attributes (weight, small caps, borders, shading, keep/widow ' +
    'settings) cannot be set on a selection — bind the style to a named style above for those.';
  host.appendChild(note);

  var presets = S.data.stylePresets || [];
  if (!presets.length) {
    host.appendChild(el('p', 'hint', 'No custom styles yet.'));
  }

  presets.forEach(function (p) {
    var ts = p.textStyle || {};
    var meta = [
      ts.fontFamily || '',
      ts.fontSizePt ? ts.fontSizePt + 'pt' : '',
      ts.bold ? 'bold' : '', ts.italic ? 'italic' : ''
    ].filter(Boolean).join(' · ');

    var row = el('div', 'customstyle');
    var apply = el('button', 'act', p.name);
    apply.title = 'Apply "' + p.name + '" to the current selection';
    apply.addEventListener('click', function () {
      call('applyStylePresetToSelection', [{ name: p.name }])
        .catch(function (e) { status(String(e.message || e), 'err'); });
    });
    row.appendChild(apply);
    if (meta) row.appendChild(el('span', 'meta', meta));

    var del = el('button', 'act danger', '×');
    del.title = 'Delete this custom style';
    del.addEventListener('click', function () {
      if (!confirm('Delete custom style "' + p.name + '"?')) return;
      call('deleteStylePreset', [{ name: p.name }])
        .then(reload);
    });
    row.appendChild(del);
    host.appendChild(row);
  });

  var addRow = el('div', 'btnrow');
  var add = el('button', 'act', 'New custom style…');
  add.title = 'Create a custom style, starting from Normal text';
  add.addEventListener('click', function () {
    var name = prompt('Name for the new custom style:', 'My style');
    if (name === null) return;
    name = name.trim();
    if (!name) { status('Give the style a name.', 'err'); return; }
    if (presets.some(function (p) { return p.name === name; }) &&
        !confirm('A custom style named "' + name + '" already exists. Replace it?')) return;
    var base = normalTextStyle();
    call('saveStylePreset', [{ name: name, textStyle: base.textStyle,
                              paragraphStyle: base.paragraphStyle }])
      .then(reload)
      .catch(function (e) { status(String(e.message || e), 'err'); });
  });
  addRow.appendChild(add);
  host.appendChild(addRow);
}

/**
 * What a brand-new custom style starts out as: a copy of Normal text.
 *
 * Not an empty style. A style with no attributes set applies nothing, so it
 * would look broken the first time it was used; the document's own base style
 * is a starting point the user can recognise and then edit away from.
 */
function normalTextStyle() {
  var list = S.data.namedStyles || [];
  var normal = null;
  list.forEach(function (st) {
    if (!normal && st.namedStyleType === 'NORMAL_TEXT') normal = st;
  });
  normal = normal || list[0] || {};
  return { textStyle: normal.textStyle || {}, paragraphStyle: normal.paragraphStyle || {} };
}

/* =================================================================
 * Panel: Bullet / list styles
 * ================================================================= */
/** A stand-in for each way Docs can number a level, to show one as an example. */
var GLYPH_SAMPLES = {
  DECIMAL: '1', ZERO_DECIMAL: '01',
  UPPER_ALPHA: 'A', ALPHA: 'a',
  UPPER_ROMAN: 'I', ROMAN: 'i'
};

/**
 * What a nesting level's marker looks like -- as the marker, not as the API's
 * description of it.
 *
 * glyphFormat is a template in which %0, %1 ... stand for the numbers of this
 * level and its parents, so filling those in with the level's symbol, or with
 * a sample of its numbering, gives back exactly what the reader sees in the
 * document: "●", or "1.", or "a)".
 */
function glyphExample(lv) {
  var fill = lv.glyphSymbol || GLYPH_SAMPLES[lv.glyphType] || '';
  if (!fill) return '';
  return (lv.glyphFormat || '%0').replace(/%\d/g, fill);
}

function renderBullets() {
  var host = document.getElementById('panel-bullets');
  host.innerHTML = '';

  if (!S.data.lists.lists.length) {
    host.appendChild(el('p', 'hint', 'This tab has no lists.'));
    return;
  }
  S.data.lists.lists.forEach(function (list, i) {
    host.appendChild(listItem(
      'List ' + (i + 1) + (list.inUse ? '' : ' (unused)'),
      list.itemCount + ' items · ' + (list.preview || ''),
      function () { return listBody(list); }));
  });
}

function listBody(list) {
  var box = el('div');
  box.appendChild(fieldRow('Glyph preset', selectField(
    [{ id: '', label: 'Choose a preset…' }].concat(S.data.constants.bulletPresets),
    '', function (v) {
      if (!v) return;
      return call('applyBulletPreset', [{ tabId: S.tabId, listId: list.listId, bulletPreset: v }])
        .then(reload);
    })));

  var rm = el('button', 'act danger', 'Remove bullets');
  rm.addEventListener('click', function () {
    call('removeBullets', [{ tabId: S.tabId, listId: list.listId }])
      .then(reload);
  });
  var row = el('div', 'btnrow');
  row.appendChild(rm);
  box.appendChild(row);

  box.appendChild(el('h2', null, 'Nesting levels'));
  list.levels.forEach(function (lv) {
    if (!lv.inUse && lv.level > 2) return;   // Docs always defines 9; show the useful ones
    var glyph = glyphExample(lv) || 'no marker';
    box.appendChild(listItem(
      'Level ' + (lv.level + 1) + (lv.inUse ? '' : ' (unused)'),
      glyph + (lv.indentStartPt != null ? ' · indent ' + fromPt(lv.indentStartPt, S.unit) + S.unit.toLowerCase() : ''),
      function () {
        var inner = el('div');
        var cur = lv.style || { textStyle: {}, paragraphStyle: {}, mixed: [] };
        var model = { textStyle: copy(cur.textStyle), paragraphStyle: copy(cur.paragraphStyle) };
        inner.appendChild(buildStyleEditor(model, function (payload) {
          return call('writeListLevelStyle', [{
            tabId: S.tabId, listId: list.listId, level: lv.level,
            textStyle: payload.textStyle, paragraphStyle: payload.paragraphStyle
          }]);
        }, { sparse: true, mixed: cur.mixed }));
        return inner;
      },
      'lvl:' + list.listId + ':' + lv.level));
  });
  return box;
}
</script>
<script>
/* =================================================================
 * Panel: Footnotes, headers, footers
 * ================================================================= */
function renderNotes() {
  var host = document.getElementById('panel-notes');
  host.innerHTML = '';

  host.appendChild(el('h2', null, 'Style all footnote text'));
  host.appendChild(segmentEditor('footnotes', 'Footnote text'));

  host.appendChild(el('h2', null, 'Footnote callout marks'));
  host.appendChild(segmentEditor('footnoteRefs', 'Footnote callouts', { paragraph: false }));

  host.appendChild(el('h2', null, 'All headers'));
  host.appendChild(segmentEditor('headers', 'Headers'));
  host.appendChild(el('h2', null, 'All footers'));
  host.appendChild(segmentEditor('footers', 'Footers'));

  // Footnotes are deliberately absent here: they are styled as one set
  // above, not one row per footnote.
  host.appendChild(el('h2', null, 'Individual headers and footers'));
  var segs = S.data.segments.headers.concat(S.data.segments.footers);
  if (!segs.length) host.appendChild(el('p', 'hint', 'This tab has no headers or footers.'));
  segs.forEach(function (seg) {
    host.appendChild(listItem(seg.role,
      (seg.empty ? '(empty) ' : '') + (seg.preview || seg.segmentId),
      function () {
        var box = el('div');
        var cur = seg.style || { textStyle: {}, paragraphStyle: {}, mixed: [] };
        var model = { textStyle: copy(cur.textStyle), paragraphStyle: copy(cur.paragraphStyle) };
        box.appendChild(buildStyleEditor(model, function (payload) {
          return call('writeSegmentStyle', [{
            tabId: S.tabId, scope: S.scope, target: 'segment', segmentId: seg.segmentId,
            textStyle: payload.textStyle, paragraphStyle: payload.paragraphStyle
          }]);
        }, { sparse: true, noPageBreak: true, mixed: cur.mixed }));
        return box;
      },
      'seg:' + seg.segmentId));
  });

  host.appendChild(el('h2', null, 'Convert footnotes to endnotes'));
  var headingIn = el('input');
  headingIn.type = 'text';
  headingIn.value = 'Notes';
  host.appendChild(fieldRow('Section heading', headingIn));

  var row = el('div', 'btnrow');
  var copyBtn = el('button', 'act', 'Append copy (keep footnotes)');
  copyBtn.addEventListener('click', function () { runConvert('copy', headingIn.value); });
  var convBtn = el('button', 'act danger', 'Convert (delete footnotes)');
  convBtn.addEventListener('click', function () {
    runConvert('convert', headingIn.value);
  });
  row.appendChild(copyBtn);
  row.appendChild(convBtn);
  host.appendChild(row);
}

function runConvert(mode, heading) {
  status('Converting…', '');
  call('convertFootnotesToEndnotes', [{ tabId: S.tabId, mode: mode, heading: heading }])
    .then(function () { status('', ''); return reload(); })
    .catch(function (e) { status(String(e.message || e), 'err'); });
}

function segmentEditor(target, label, opts) {
  opts = opts || {};
  var cur = currentSegmentStyle(target);
  var model = { textStyle: copy(cur.textStyle), paragraphStyle: copy(cur.paragraphStyle) };
  return buildStyleEditor(model, function (payload) {
    return call('writeSegmentStyle', [{
      tabId: S.tabId, scope: S.scope, target: target,
      textStyle: payload.textStyle, paragraphStyle: payload.paragraphStyle
    }]);
  }, { sparse: true, noPageBreak: true, mixed: cur.mixed,
       paragraph: opts.paragraph, character: opts.character });
}

/** Current values behind each of the "style them all at once" editors. */
function currentSegmentStyle(target) {
  var seg = S.data.segments || {};
  var src = target === 'footnotes' ? seg.allFootnotesStyle
          : target === 'headers' ? seg.allHeadersStyle
          : target === 'footers' ? seg.allFootersStyle
          : target === 'footnoteRefs' ? seg.footnoteRefStyle
          : null;
  return {
    textStyle: (src && src.textStyle) || {},
    paragraphStyle: (src && src.paragraphStyle) || {},
    mixed: (src && src.mixed) || []
  };
}

/* =================================================================
 * Panel: Tables
 * ================================================================= */
function renderTables() {
  var host = document.getElementById('panel-tables');
  host.innerHTML = '';

  if (!S.data.tables.length) {
    host.appendChild(el('p', 'hint', 'This document has no tables.'));
    return;
  }

  var active = S.data.activeTableIndex;
  var chosen = (active === null || active === undefined) ? null : S.data.tables[active];

  if (!chosen) {
    // Every table is still listed, because a document with one table should
    // not make you click into it first. With several, the list is how you
    // reach the one you have not put the cursor in.
    host.appendChild(el('p', 'hint',
      'Click inside a table in the document to edit it here. Until then, every table ' +
      'in this tab is listed below.'));
    S.data.tables.forEach(function (t) {
      host.appendChild(listItem(
        'Table ' + (t.index + 1),
        t.rows + '×' + t.columns + (t.preview ? ' · ' + t.preview : ''),
        function () { return tableBody(t); }));
    });
    return;
  }

  host.appendChild(el('p', 'hint',
    'Editing the table your cursor is in — table ' + (chosen.index + 1) + ' of ' +
    S.data.tables.length + '. Click inside a different table to switch.'));
  var row = listItem(
    'Table ' + (chosen.index + 1),
    chosen.rows + '×' + chosen.columns + (chosen.preview ? ' · ' + chosen.preview : ''),
    function () { return tableBody(chosen); });
  host.appendChild(row);
  // The one table on screen starts open. listItem restores whatever state the
  // row was last left in, so only open it if it came back closed.
  if (!row.classList.contains('open')) row.querySelector('.head').click();
}

function tableBody(t) {
  var box = el('div');
  function put(patch) {
    patch.tabId = S.tabId;
    patch.startIndex = t.startIndex;
    patch.columnCount = t.columns;
    return call('writeTableFormat', [patch]);
  }

  var gCells = group('Cells');
  box.appendChild(gCells);

  // The cell fields show the current values of whichever set of cells is
  // selected above, so switching "Apply to" re-renders this section.
  var applyTo = 'all';
  var cellHost = el('div');
  gCells.appendChild(fieldRow('Apply to', selectField(
    [{ id: 'all', label: 'Every cell' }, { id: 'headerRow', label: 'First row only' }],
    'all', function (v) { applyTo = v; renderCells(); })));
  gCells.appendChild(cellHost);

  function renderCells() {
    cellHost.innerHTML = '';
    var cur = (applyTo === 'headerRow' ? t.headerCellStyle : t.cellStyle) ||
              { style: {}, mixed: [] };
    var v = cur.style || {};
    if (cur.mixed && cur.mixed.length) {
      cellHost.appendChild(el('p', 'hint',
        'Differs across these cells: ' + cur.mixed.map(fieldLabel).join(', ') +
        '. Those are shown blank; setting one applies it to every cell here.'));
    }
    [['paddingTopPt', 'Padding top'], ['paddingBottomPt', 'Padding bottom'],
     ['paddingLeftPt', 'Padding left'], ['paddingRightPt', 'Padding right']].forEach(function (p) {
      cellHost.appendChild(fieldRow(p[1], numUnit(v[p[0]], function (val) {
        var c = {}; c[p[0]] = val;
        return put({ cell: c, applyCellsTo: applyTo });
      }, { min: 0 })));
    });
    cellHost.appendChild(fieldRow('Align', selectField(
      [{ id: '', label: '—' }].concat(CONTENT_ALIGNMENTS), v.contentAlignment || '', function (val) {
        if (!val) return;
        return put({ cell: { contentAlignment: val }, applyCellsTo: applyTo });
      })));
    cellHost.appendChild(fieldRow('Fill', colorField(v.backgroundColor, function (val) {
      return put({ cell: { backgroundColor: val }, applyCellsTo: applyTo });
    })));
  }
  renderCells();

  var gBord = group('Cell borders (all four sides)');
  box.appendChild(gBord);
  var curBorder = (((t.cellStyle || {}).style || {}).borderTop) || {};
  var bw = curBorder.widthPt === undefined ? null : curBorder.widthPt;
  var bc = curBorder.color === undefined ? null : curBorder.color;
  var bd = curBorder.dashStyle || 'SOLID';
  function pushBorder() {
    var b = { color: bc, widthPt: bw, dashStyle: bd };
    return put({
      cell: { borderTop: b, borderBottom: b, borderLeft: b, borderRight: b },
      applyCellsTo: applyTo
    });
  }
  gBord.appendChild(fieldRow('Width', numPt(bw, function (v) { bw = v; return pushBorder(); }, { min: 0 })));
  gBord.appendChild(fieldRow('Colour', colorField(bc, function (v) { bc = v; return pushBorder(); })));
  gBord.appendChild(fieldRow('Dash', selectField(DASH_STYLES, bd, function (v) { bd = v; return pushBorder(); })));

  var gRows = group('Rows');
  box.appendChild(gRows);
  // Row settings only have a single current value when every row agrees.
  var rows = t.rowStyles || [];
  function agreed(key) {
    if (!rows.length) return null;
    var first = JSON.stringify(rows[0][key]);
    for (var i = 1; i < rows.length; i++) {
      if (JSON.stringify(rows[i][key]) !== first) return null;
    }
    return rows[0][key];
  }
  gRows.appendChild(fieldRow('Min height', numUnit(agreed('minRowHeightPt'),
    function (v) { return put({ rows: { minRowHeightPt: v } }); }, { min: 0 })));
  var rchecks = el('div', 'checks');
  rchecks.appendChild(checkField('First row is a header', t.headerRow, function (v) {
    return put({ rows: { tableHeader: v, rowIndices: [0] } });
  }));
  rchecks.appendChild(checkField('Prevent row overflow', agreed('preventOverflow') === true,
    function (v) { return put({ rows: { preventOverflow: v } }); }));
  gRows.appendChild(rchecks);
  gRows.appendChild(fieldRow('Pinned header rows', numPlain(t.pinnedHeaderRows,
    function (v) { return put({ pinnedHeaderRowsCount: v }); }, { min: 0, integer: true })));

  var gTCols = group('Columns');
  box.appendChild(gTCols);
  gTCols.appendChild(fieldRow('Width', numUnit((t.columnWidths[0] || {}).widthPt, function (v) {
    return put({ columns: { widthPt: v, widthType: 'FIXED_WIDTH' } });
  }, { min: 1 })));
  gTCols.appendChild(fieldRow('Sizing', selectField(
    [{ id: 'EVENLY_DISTRIBUTED', label: 'Evenly distributed' }, { id: 'FIXED_WIDTH', label: 'Fixed width' }],
    (t.columnWidths[0] || {}).widthType || 'EVENLY_DISTRIBUTED',
    function (v) { return put({ columns: { widthType: v } }); })));
  return box;
}

/* =================================================================
 * Panel: Presets
 * ================================================================= */
function renderPresets() {
  var host = document.getElementById('panel-presets');
  host.innerHTML = '';

  host.appendChild(el('h2', null, 'Whole-document presets'));
  var saveRow = el('div', 'btnrow');
  var saveBtn = el('button', 'act primary', 'Save current formatting as a preset');
  saveBtn.addEventListener('click', function () {
    var name = prompt('Preset name:');
    if (!name) return;
    call('savePreset', [{ name: name, tabId: S.tabId }])
      .then(reload)
      .catch(function (e) { status(String(e.message || e), 'err'); });
  });
  saveRow.appendChild(saveBtn);
  host.appendChild(saveRow);

  if (!S.data.presets.length) {
    host.appendChild(el('p', 'hint', 'No saved presets yet.'));
  }
  S.data.presets.forEach(function (p) {
    var item = el('div', 'item');
    var head = el('div', 'head');
    head.appendChild(el('span', 'name', p.name));
    var btns = el('span');
    var apply = el('button', 'act', 'Apply');
    apply.addEventListener('click', function () {
      call('applyPreset', [{ name: p.name, tabId: S.tabId, scope: S.scope }])
        .then(reload)
        .catch(function (e) { status(String(e.message || e), 'err'); });
    });
    var del = el('button', 'act danger', '×');
    del.addEventListener('click', function () {
      if (!confirm('Delete preset "' + p.name + '"?')) return;
      call('deletePreset', [{ name: p.name }]).then(reload);
    });
    btns.appendChild(apply);
    btns.appendChild(del);
    head.appendChild(btns);
    item.appendChild(head);
    host.appendChild(item);
  });

  host.appendChild(el('h2', null, 'Saved style presets'));
  if (!S.data.stylePresets.length) {
    host.appendChild(el('p', 'hint', 'No saved style presets yet.'));
  }
  S.data.stylePresets.forEach(function (sp) {
    var item = el('div', 'item');
    var head = el('div', 'head');
    head.appendChild(el('span', 'name', sp.name));
    var meta = el('span', 'meta',
      [(sp.textStyle || {}).fontFamily, (sp.textStyle || {}).fontSizePt ?
        sp.textStyle.fontSizePt + 'pt' : ''].filter(Boolean).join(' · '));
    head.appendChild(meta);
    item.appendChild(head);
    var body = el('div', 'body');
    item.classList.add('open');   // this row has no head to click; it is always open
    body.appendChild(fieldRow('Bind to', selectField(
      [{ id: '', label: 'Choose a named style…' }].concat(S.data.constants.namedStyleTypes),
      '', function (v) {
        if (!v) return;
        return call('applyStylePresetToNamedStyle', [{
          name: sp.name, namedStyleType: v, tabId: S.tabId, scope: S.scope
        }]).then(reload);
      })));
    var drow = el('div', 'btnrow');
    var d = el('button', 'act danger', 'Delete');
    d.addEventListener('click', function () {
      call('deleteStylePreset', [{ name: sp.name }]).then(reload);
    });
    drow.appendChild(d);
    body.appendChild(drow);
    item.appendChild(body);
    item.classList.add('open');
    host.appendChild(item);
  });

  host.appendChild(el('h2', null, 'Export / import JSON'));
  var ta = el('textarea');
  ta.id = 'configJson';
  host.appendChild(ta);
  var ioRow = el('div', 'btnrow');
  var exp = el('button', 'act', 'Export');
  exp.addEventListener('click', function () {
    call('exportConfig', [S.tabId]).then(function (cfg) {
      ta.value = JSON.stringify(cfg, null, 2);
    });
  });
  var imp = el('button', 'act primary', 'Import');
  imp.addEventListener('click', function () {
    if (!ta.value.trim()) { status('Paste a configuration first', 'err'); return; }
    call('importConfig', [{ config: ta.value, tabId: S.tabId, scope: S.scope }])
      .then(reload)
      .catch(function (e) { status(String(e.message || e), 'err'); });
  });
  ioRow.appendChild(exp);
  ioRow.appendChild(imp);
  host.appendChild(ioRow);
}

/* =================================================================
 * Shell
 * ================================================================= */
function renderAll() {
  var scroll = window.pageYOffset || document.documentElement.scrollTop || 0;
  S.unitFields = [];
  renderPage();
  renderStyles();
  renderBullets();
  renderNotes();
  renderTables();
  renderPresets();
  window.scrollTo(0, scroll);
}

function reload() {
  return call('loadAll', [S.tabId]).then(function (data) {
    S.data = data;
    S.tabId = data.activeTabId;
    S.fingerprint = JSON.stringify(data);
    renderAll();
    return data;
  });
}

/* =================================================================
 * Staying in step with the document
 *
 * Apps Script has no edit trigger for Docs -- onOpen and onInstall are the
 * only document triggers, and neither fires when someone reformats text --
 * so there is nothing to subscribe to. The sidebar polls instead: re-read
 * the document, and if it differs from what is on screen, re-render.
 *
 * The poll runs while you are typing. Everything on screen is overwritten
 * with what the document now says, with one exception: the field that has
 * the focus and holds something different from what the document last said
 * keeps its text and its caret, because that is a value you have not
 * finished typing. Every other field, including one you left half-typed and
 * clicked away from, goes back to the truth.
 * ================================================================= */

/* ---- how often ---------------------------------------------------
 * The interval follows what a read actually costs, so reading never takes up
 * more than a twentieth of the sidebar's time: wait twenty times the last
 * read's duration, never under a second, never over five. The wait starts
 * when the previous read finishes, so two reads are never closer together
 * than a second however slow one of them was.
 */
var POLL_MIN_MS = 1000;
var POLL_MAX_MS = 5000;
var POLL_DUTY = 20;
var lastFetchMs = 0;

function nextPollDelay() {
  return Math.max(POLL_MIN_MS, Math.min(POLL_MAX_MS, lastFetchMs * POLL_DUTY));
}

/* ---- keeping the edit you are in the middle of -------------------- */

/**
 * Where a node sits, as the chain of child indexes down from <body>.
 *
 * renderAll builds the page from the data, so the same data puts the same
 * field in the same place; that is enough to find a field again on the other
 * side of a re-render. If the document changed shape -- a table added, a
 * section removed -- the path lands somewhere else or nowhere, and the edit
 * is dropped rather than pasted into whatever now sits there.
 */
function domPath(node) {
  var path = [];
  for (var n = node; n && n !== document.body; n = n.parentNode) {
    if (!n.parentNode) return null;                 // detached: no path to give
    path.unshift(Array.prototype.indexOf.call(n.parentNode.children, n));
  }
  return path;
}

function atPath(path) {
  var n = document.body;
  for (var i = 0; n && i < path.length; i++) n = n.children[path[i]];
  return n || null;
}

var rerendering = false;

function renderKeepingEdits() {
  var a = document.activeElement;
  var keep = null;
  // The focused field is found again either way. Whether its contents survive
  // is the separate question below: dirty means you have typed something the
  // document does not know about yet, and only that is worth keeping.
  if (document.hasFocus() && a && a.isDirty) {
    var path = domPath(a);
    if (path) {
      keep = { path: path, tag: a.tagName, dirty: a.isDirty(),
               value: a.value, checked: a.checked,
               start: a.selectionStart, end: a.selectionEnd };
    }
  }

  rerendering = true;
  try { renderAll(); } finally { rerendering = false; }

  if (!keep) return;
  var node = atPath(keep.path);
  if (!node || node.tagName !== keep.tag || !node.isDirty) return;
  if (keep.dirty) {
    node.value = keep.value;
    node.checked = keep.checked;
  }
  // Losing the focus every second because the document changed would make the
  // sidebar unusable, so it goes back whether or not anything was typed.
  node.focus();
  // Only text-like inputs have a selection; a number or colour input throws.
  try { node.setSelectionRange(keep.start, keep.end); } catch (e) { /* not text */ }
}

/* ---- the read ---------------------------------------------------- */

function poll() {
  if (!S.data || S.busy || document.hidden) return Promise.resolve();
  // call() bails above when anything else is in flight, so the queue is empty
  // here and this is the server round trip rather than time spent waiting.
  var t0 = Date.now();
  return call('loadAll', [S.tabId])
    .then(function (data) {
      lastFetchMs = Date.now() - t0;
      var fresh = JSON.stringify(data);
      if (fresh === S.fingerprint) return;
      S.data = data;
      S.tabId = data.activeTabId;
      S.fingerprint = fresh;
      renderKeepingEdits();
    })
    .catch(function () { /* transient: the next tick tries again */ });
}

/* ---- the clock ----------------------------------------------------
 * The schedule runs in a worker. That is as much of the poll as can leave the
 * main thread: google.script.run is injected into this page by the HtmlService
 * bootstrap and does not exist in a worker, and a worker has no parent frame
 * to postMessage through, so the read itself has to be issued here. What the
 * worker does buy is a timer that is not queued behind the sidebar's own
 * layout and rendering work.
 *
 * Apps Script serves no static files, so there is no URL to point a Worker at
 * and it is built from a blob instead. If the page's content security policy
 * refuses that, setTimeout does the same job on the main thread.
 *
 * Nothing keeps running once the sidebar is not on screen. Closing it destroys
 * this frame, which takes the timer and the worker with it, but that is the
 * browser tidying up after us rather than us stopping -- and it does not cover
 * the sidebar merely being hidden, which leaves the frame alive and polling a
 * document nobody is looking at. So the schedule is stopped explicitly:
 * hidden pauses it, and the frame going away terminates the worker outright.
 */
var scheduleNext = null;
var pollWorker = null;
var polling = false;

function startPolling() {
  var src = 'onmessage = function (e) { setTimeout(function () { postMessage(1); }, e.data); };';
  try {
    pollWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) {
    pollWorker = null;
  }

  if (pollWorker) {
    pollWorker.onmessage = tick;
    // A worker that dies takes the pending tick with it, so restart the chain
    // on the main thread rather than leaving the sidebar silently frozen.
    pollWorker.onerror = function () { pollWorker = null; setTimeout(tick, POLL_MIN_MS); };
    scheduleNext = function (ms) {
      if (pollWorker) pollWorker.postMessage(ms); else setTimeout(tick, ms);
    };
  } else {
    scheduleNext = function (ms) { setTimeout(tick, ms); };
  }

  polling = true;
  schedule();
}

function tick() { poll().then(schedule); }

/**
 * Every path back into the loop goes through here, so clearing `polling` is
 * enough to stop it: a timer already in flight still fires, finds the flag
 * down, and schedules nothing further.
 */
function schedule() { if (polling) scheduleNext(nextPollDelay()); }

/** Hidden, but still there: keep the worker, stop asking. */
function pausePolling() { polling = false; }

function resumePolling() {
  if (polling || !scheduleNext) return;
  polling = true;
  schedule();
}

/** Gone for good: give the worker back rather than leaking a thread. */
function stopPolling() {
  polling = false;
  if (pollWorker) {
    pollWorker.terminate();
    pollWorker = null;
  }
}

function switchTab(name) {
  ['page', 'styles', 'bullets', 'notes', 'tables', 'presets'].forEach(function (n) {
    document.getElementById('panel-' + n).classList.toggle('active', n === name);
    document.getElementById('tab-' + n).classList.toggle('active', n === name);
  });
}

function boot() {
  document.getElementById('unit').addEventListener('change', function (e) {
    S.unit = e.target.value;
    // Every dimension field, and every summary line that quotes one, is
    // rebuilt from the cached payload -- no server call, and nothing is left
    // showing the old unit.
    S.unitFields.forEach(function (f) {
      f.input.value = fromPt(f.input._pt, S.unit);
      f.input.setLive(f.input._pt);
      f.tag.textContent = S.unit.toLowerCase();
    });
    if (S.data) renderAll();
  });
  document.getElementById('doctab').addEventListener('change', function (e) {
    S.tabId = e.target.value || null;
    status('Loading tab…', '');
    reload().then(function () { status('', ''); });
  });
  ['page', 'styles', 'bullets', 'notes', 'tables', 'presets'].forEach(function (n) {
    document.getElementById('tab-' + n).addEventListener('click', function () { switchTab(n); });
  });

  var tipItem = document.getElementById('tipItem');
  document.getElementById('tipHead').addEventListener('click', function () {
    tipItem.classList.toggle('open');
  });

  // Coming back to the sidebar after working in the document is the moment the
  // user most wants it to be current, and it is the closest thing to an edit
  // event this add-on can get: Docs offers no cursor or typing trigger, and a
  // server-side trigger could not reach an open sidebar anyway.
  window.addEventListener('focus', function () { setTimeout(poll, 0); });

  // Closing the sidebar tears down this frame; hiding it does not. Cover both,
  // so the poll never outlives the panel the user was looking at.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pausePolling(); else resumePolling();
  });
  window.addEventListener('pagehide', stopPolling);
  window.addEventListener('unload', stopPolling);

  status('Loading document…', '');
  // The sidebar is an ordinary page in an iframe, so this reaches the browser
  // console -- pick the add-on's frame in the console's frame selector to see
  // it. Server-side Logger.log would go to the Apps Script execution log
  // instead, which is no help while looking at the sidebar.
  var firstReadT0 = Date.now();
  reload().then(function (data) {
    var firstReadMs = Date.now() - firstReadT0;
    console.log('Stylist: first document read took ' + firstReadMs + ' ms');
    // It is also a measurement of exactly what the poll pays, so the first
    // wait is paced by it rather than by the one-second floor.
    lastFetchMs = firstReadMs;
    var sel = document.getElementById('doctab');
    if (data.tabs.length > 1) {
      data.tabs.forEach(function (t) {
        var o = el('option', null, new Array(t.depth + 1).join('— ') + t.title);
        o.value = t.tabId;
        sel.appendChild(o);
      });
      sel.value = data.activeTabId;
      document.getElementById('tabRow').style.display = 'flex';
    }
    var fl = document.getElementById('fontlist');
    data.constants.fonts.forEach(function (f) {
      var o = el('option');
      o.value = f;
      fl.appendChild(o);
    });
    status('', '');
    startPolling();
  }).catch(function (e) {
    status('Could not load: ' + String((e && e.message) || e), 'err');
  });
}

document.addEventListener('DOMContentLoaded', boot);
</script>
